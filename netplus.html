<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Network+ おじさん問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Kiwi+Maru:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: single study column — control strip, question card, ojisan chat bubble, domain progress vs 80% target */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#141B26; --muted:#5B6576; --line:#D5DCE5;
  --accent:#0B7A75; --accent-soft:#DDF1EF;
  --ok:#11784A; --ok-soft:#DDF3E7; --ng:#BF3329; --ng-soft:#FBE4E1;
  --bubble:#D9F5CF; --bubble-ink:#173B1C;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-oji:"Kiwi Maru","Hiragino Maru Gothic ProN","Zen Kaku Gothic New",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#18202B; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2B3645;
  --accent:#4CC7BE; --accent-soft:#12302E; --ok:#4CC98C; --ok-soft:#14301F; --ng:#FF7F73; --ng-soft:#3A1B19;
  --bubble:#1F3B24; --bubble-ink:#D6F2CC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#18202B; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2B3645;
  --accent:#4CC7BE; --accent-soft:#12302E; --ok:#4CC98C; --ok-soft:#14301F; --ng:#FF7F73; --ng-soft:#3A1B19;
  --bubble:#1F3B24; --bubble-ink:#D6F2CC; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.crowd{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.crowd b{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.share{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
.share input{margin-top:3px;accent-color:var(--accent)}
.share a{color:var(--accent)}
.acct{border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.acct summary{cursor:pointer;color:var(--accent);font-weight:700}
.acct-form{display:flex;flex-direction:column;gap:10px;margin-top:10px;max-width:420px}
.acct-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.acct-form input{font:500 15px var(--f-body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.acct-form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.acct-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acct-row .next{align-self:auto}
.acct-note{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.acct-msg{margin:6px 0 0;font-size:12.5px;color:var(--ink);min-height:1em}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.controls{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer;display:flex;gap:6px;align-items:baseline}
.chip .w{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"] .w{color:rgba(255,255,255,.8)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13px var(--f-body);padding:8px 4px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tag{color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px}
.q{font-size:16.5px;font-weight:700;line-height:1.7;margin:0}
.choices{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.choice{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 12px;font:500 15px/1.55 var(--f-body);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{font-family:var(--f-mono);font-weight:700;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--bg);font-size:12px}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .k{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice.wrong .k{background:var(--ng);color:#fff}
.verdict{font-weight:900;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.chat{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 16px var(--f-oji)}
.name{font-size:11px;color:var(--muted);margin-bottom:3px}
.bubble{position:relative;background:var(--bubble);color:var(--bubble-ink);border-radius:4px 16px 16px 16px;padding:11px 14px;font-family:var(--f-oji);font-size:14.5px;line-height:1.8;min-width:0;overflow-wrap:anywhere}
.point{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.65}
.point .pl{font-size:12px;font-weight:700;color:var(--accent)}
.next{align-self:flex-end;border:0;background:var(--accent);color:#fff;font:700 14px var(--f-body);padding:10px 22px;border-radius:10px;cursor:pointer}
.bar{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.bar .track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
section.stats{display:flex;flex-direction:column;gap:10px}
h2{font-size:14px;margin:0;font-weight:700}
.st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.st .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.st .g{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:var(--line)}
.st .g i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ok)}
.st .g i.low{background:var(--ng)}
.st .g b{position:absolute;top:-3px;bottom:-3px;left:80%;width:2px;background:var(--ink);opacity:.5}
.note{font-size:12px;color:var(--muted);margin:0}
.reset{align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 12px var(--f-body);border-radius:8px;padding:6px 10px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
@media (prefers-reduced-motion:no-preference){.bubble{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
</style>
<script src="config.js"></script>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">CompTIA Network+ N10-009</span>
    <h1>Network+ おじさん問題集</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="controls">
    <div class="row" id="domains" role="group" aria-label="出題分野"></div>
    <div class="seg" role="group" aria-label="出題モード">
      <button id="m-rand" aria-pressed="true">ランダム</button>
      <button id="m-seq" aria-pressed="false">順番</button>
      <button id="m-wrong" aria-pressed="false">間違えた問題</button>
    </div>
  </div>

  <div class="bar"><span id="pos">0 / 0</span><div class="track"><div class="fill" id="posfill" style="width:0"></div></div><span id="sess">正答 0/0</span></div>

  <article class="card" id="card"></article>

  <section class="stats">
    <h2>分野別の正答率（直近の解答）</h2>
    <div id="stats" style="display:flex;flex-direction:column;gap:12px"></div>
    <p class="note">縦線は合格目安の80%。初見の問題で安定して超えれば本番も合格圏だヨ。</p>
    <button class="reset" id="reset">記録をリセット</button>
  </section>
</div>

<script>

  if(idx>=deck.length){
    const p=sess.n?Math.round(sess.ok/sess.n*100):0;
    card.innerHTML='<div class="empty"><div style="font:900 32px var(--f-mono);color:var(--ink)">'+p+'%</div>'+sess.ok+' / '+sess.n+' 問正解<br><br><button class="next" id="again">もう一周する</button></div>';
    $("again").onclick=buildDeck; return;
  }
  const q=deck[idx], order=shuffle([0,1,2,3]), dm=DOMAINS.find(d=>d.id===q.d);
  card.innerHTML='<div class="meta"><span class="tag">'+dm.name+'</span><span>No.'+q.id+'</span></div>'+
    '<p class="q"></p><ol class="choices"></ol><div id="after"></div>';
  card.querySelector(".q").textContent=q.q;
  const ol=card.querySelector(".choices");
  order.forEach((ci,k)=>{const li=document.createElement("li");const b=document.createElement("button");b.className="choice";b.dataset.ci=ci;
    b.innerHTML='<span class="k">'+"ABCD"[k]+'</span><span></span>';b.lastChild.textContent=q.c[ci];
    b.onclick=()=>answer(q,ci);li.appendChild(b);ol.appendChild(li)});
}

function answer(q,ci){
  const ok=ci===q.a; sess.n++; if(ok) sess.ok++; rec[q.id]=ok?1:0; save(); report(q.id, ok);
  document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;const c=+b.dataset.ci;if(c===q.a)b.classList.add("right");else if(c===ci)b.classList.add("wrong")});
  const af=$("after");
  af.innerHTML='<div style="display:flex;flex-direction:column;gap:12px"><div class="verdict '+(ok?'ok':'ng')+'">'+(ok?'⭕ 正解':'❌ 不正解　正解：'+'')+'</div>'+
    '<div class="chat"><div class="avatar" aria-hidden="true">お</div><div style="min-width:0"><div class="name">ネットワークおじさん</div><div class="bubble"></div></div></div>'+
    '<div class="crowd" id="crowd"></div>'+
    '<div class="point"><span class="pl">📌 本番の判断ポイント</span><span class="pt"></span></div>'+
    '<button class="next" id="next">次の問題 →</button></div>';
  if(!ok) af.querySelector(".verdict").textContent="❌ 不正解　正解："+q.c[q.a];
  af.querySelector(".bubble").textContent=q.e;
  af.querySelector(".point .pt").textContent=q.p;
  { const cl = crowdLine(q.id), ce = af.querySelector("#crowd"); if (cl) ce.innerHTML = cl; else ce.remove(); }
  $("sess").textContent="正答 "+sess.ok+"/"+sess.n;
  $("next").onclick=()=>{idx++;render();window.scrollTo({top:0,behavior:"smooth"})};
  $("next").focus({preventScroll:true});
  renderStats();
}

function renderStats(){
  const el=$("stats"); el.innerHTML="";
  DOMAINS.forEach(d=>{
    const qs=Q.filter(q=>q.d===d.id), done=qs.filter(q=>q.id in rec), ok=done.filter(q=>rec[q.id]===1).length;
    const p=done.length?Math.round(ok/done.length*100):0;
    const div=document.createElement("div");div.className="st";
    div.innerHTML='<span class="lbl">'+d.name+'</span><span class="num">'+(done.length?p+'%':'—')+'　'+done.length+'/'+qs.length+'問</span><div class="g"><i class="'+(p<80?'low':'')+'" style="width:'+p+'%"></i><b></b></div>';
    el.appendChild(div);
  });
}

function setMode(m){mode=m;["rand","seq","wrong"].forEach(k=>$("m-"+k).setAttribute("aria-pressed",String(k===m)));buildDeck()}
$("m-rand").onclick=()=>setMode("rand");$("m-seq").onclick=()=>setMode("seq");$("m-wrong").onclick=()=>setMode("wrong");
let armed=false;
$("reset").onclick=()=>{if(!armed){armed=true;$("reset").textContent="本当にリセットする？（もう一度タップ）";setTimeout(()=>{armed=false;$("reset").textContent="記録をリセット"},4000);return}
  rec={};save();armed=false;$("reset").textContent="記録をリセット";renderStats();buildDeck()};

$("sub").textContent="全"+Q.length+"問・選択肢は毎回シャッフル。解説はネットワークおじさんが担当するヨ😉";

/* ---- 解答の送信とアカウント（自前サーバー版のみ） ---- */
const EXAM = KEY.startsWith("net") ? "net" : "sec";
const ENDPOINT = (window.QUIZ_CONFIG && window.QUIZ_CONFIG.endpoint) || "";
const SHARE_KEY = "oji-share-v1", CID_KEY = "oji-cid-v1", ACCT_KEY = "oji-acct-v1";
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
let shareOn = ls.get(SHARE_KEY) !== "0";
let cid = ls.get(CID_KEY) || "";
if (!/^[a-z0-9-]{8,40}$/.test(cid)) { cid = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2, 12))); ls.set(CID_KEY, cid); }
let acct = null; try { acct = JSON.parse(ls.get(ACCT_KEY) || "null"); } catch (e) {}
let crowd = null;

function report(qid, ok) {
  if (!ENDPOINT || !shareOn) return;
  const b = { exam: EXAM, cid: cid, items: [{ q: qid, c: ok ? 1 : 0 }] };
  if (acct) { b.uid = acct.uid; b.token = acct.token; }
  try { fetch(ENDPOINT, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(b) }); } catch (e) {}
}
function api(payload) {
  return fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) }).then(r => r.json());
}
function loadCrowd() {
  if (!ENDPOINT) return;
  fetch(ENDPOINT + "?exam=" + EXAM).then(r => r.json()).then(s => { if (s && s.ok) crowd = s; }).catch(() => {});
}
function crowdLine(qid) {
  if (!crowd || !crowd.q || !crowd.q[qid] || crowd.q[qid][0] < 3) return "";
  const v = crowd.q[qid];
  return "みんなの正答率 <b>" + Math.round(v[1] / v[0] * 100) + "%</b>（" + v[0] + "件の解答）";
}
function syncMine(msgEl) {
  if (!ENDPOINT || !acct) return Promise.resolve();
  const u = ENDPOINT + "?exam=" + EXAM + "&action=mine&uid=" + encodeURIComponent(acct.uid) + "&token=" + encodeURIComponent(acct.token);
  return fetch(u).then(r => r.json()).then(s => {
    if (!s.ok) { if (s.error === "bad_token") { acct = null; ls.set(ACCT_KEY, null); renderAcct(); } return; }
    let n = 0; Object.keys(s.q).forEach(k => { rec[k] = s.q[k]; n++; });
    save(); renderStats();
    if (msgEl) msgEl.textContent = n ? "ほかの端末の記録 " + n + "問分を読み込みました。" : "";
  }).catch(() => {});
}
const ERR = { taken: "このIDはすでに使われています。別のIDにしてください。", bad_id: "IDは半角英数字・ハイフン・アンダーバーで3〜20文字にしてください。",
  bad_pass: "パスワードは8〜64文字にしてください。", bad_login: "IDかパスワードが違います。", locked: "ログインの失敗が続いたため、15分ほど待ってから試してください。",
  rate_limited: "短時間に操作が集中しています。しばらく待ってから試してください。" };
let acctBox = null;
function renderAcct() {
  if (!acctBox) return;
  if (acct) {
    acctBox.innerHTML = '<div class="acct-row"><span>ログイン中：<b></b></span><button type="button" class="reset" id="acct-out">ログアウト</button></div><p class="acct-msg" id="acct-msg" aria-live="polite"></p>';
    acctBox.querySelector("b").textContent = acct.uid;
    acctBox.querySelector("#acct-out").onclick = () => { acct = null; ls.set(ACCT_KEY, null); renderAcct(); };
    return;
  }
  acctBox.innerHTML = '<details><summary>IDとパスワードで記録を引き継ぐ（任意）</summary>' +
    '<form class="acct-form" id="acct-form" novalidate><p class="acct-note">登録すると、別の端末やブラウザでも同じ成績で続きから解けます。ほかのサイトと同じパスワードは使わないでください。</p>' +
    '<label>ID<input id="acct-id" name="username" autocomplete="username" inputmode="latin" maxlength="20" placeholder="半角英数字 3〜20文字"></label>' +
    '<label>パスワード<input id="acct-pass" name="password" type="password" autocomplete="current-password" maxlength="64" placeholder="8文字以上"></label>' +
    '<div class="acct-row"><button type="submit" class="next" data-act="login">ログイン</button><button type="submit" class="reset" data-act="register">新規登録</button></div>' +
    '<p class="acct-msg" id="acct-msg" aria-live="polite"></p></form></details>';
  const f = acctBox.querySelector("#acct-form"), msg = acctBox.querySelector("#acct-msg");
  f.onsubmit = ev => {
    ev.preventDefault();
    const act = (ev.submitter && ev.submitter.dataset.act) || "login";
    const uid = f.querySelector("#acct-id").value.trim(), pass = f.querySelector("#acct-pass").value;
    if (!/^[A-Za-z0-9_-]{3,20}$/.test(uid)) { msg.textContent = ERR.bad_id; return; }
    if (pass.length < 8) { msg.textContent = ERR.bad_pass; return; }
    msg.textContent = act === "register" ? "登録しています…" : "ログインしています…";
    f.querySelectorAll("button").forEach(b => b.disabled = true);
    api({ action: act, uid: uid, pass: pass, cid: cid }).then(r => {
      if (!r.ok) { msg.textContent = ERR[r.error] || "うまくいきませんでした。時間をおいて試してください。"; return; }
      acct = { uid: r.uid, token: r.token }; ls.set(ACCT_KEY, JSON.stringify(acct)); renderAcct();
      const m = acctBox.querySelector("#acct-msg"); m.textContent = act === "register" ? "登録しました。これからの解答はこのIDで記録されます。" : "ログインしました。";
      if (act === "login") syncMine(m);
    }).catch(() => { msg.textContent = "通信できませんでした。電波の状態を確認して、もう一度試してください。"; })
      .finally(() => f.querySelectorAll("button").forEach(b => b.disabled = false));
  };
}
function mountShare() {
  const sec = document.querySelector("section.stats");
  if (!sec || !ENDPOINT) return;
  acctBox = document.createElement("div"); acctBox.className = "acct"; sec.appendChild(acctBox); renderAcct();
  const box = document.createElement("label");
  box.className = "share";
  box.innerHTML = '<input type="checkbox" id="share-toggle"><span>解答結果（問題番号と正誤）を送り、みんなの正答率の集計に使います。ログインしていなければ匿名です。<a href="dashboard.html">集計を見る</a></span>';
  sec.appendChild(box);
  const cb = box.querySelector("input"); cb.checked = shareOn;
  cb.onchange = () => { shareOn = cb.checked; ls.set(SHARE_KEY, shareOn ? "1" : "0"); };
}
mountShare(); loadCrowd(); syncMine();

renderDomains(); renderStats(); buildDeck();
</script>

</body>
