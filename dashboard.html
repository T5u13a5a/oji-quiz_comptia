<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おじさん問題集 みんなの集計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one reading column — exam switch, headline numbers, domain bars vs 80% target, daily volume, hardest questions table */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#141B26; --muted:#5B6576; --line:#D5DCE5; --grid:#E6EBF1;
  --accent:#2347D3; --accent-soft:#E3E9FC; --low:#BF3329; --low-soft:#FBE4E1;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F141C; --surface:#18202B; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2B3645; --grid:#222C39;
  --accent:#7D9BFF; --accent-soft:#1E2A4A; --low:#FF7F73; --low-soft:#3A1B19; color-scheme:dark}}
body[data-exam="net"]{--accent:#0B7A75;--accent-soft:#DDF1EF}
@media (prefers-color-scheme: dark){body[data-exam="net"]{--accent:#4CC7BE;--accent-soft:#12302E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
h1{margin:0;font-size:24px;font-weight:900;text-wrap:balance}
h2{margin:0;font-size:15px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
a{color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);max-width:360px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:9px 6px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font:700 26px var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ph .note{font-size:12px;color:var(--muted)}
.dom{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center}
.dom .name{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dom .val{font:700 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.dom .val small{display:block;font:500 11px var(--f-mono);color:var(--muted)}
.track{grid-column:1/2;position:relative;height:10px;background:var(--grid);border-radius:5px}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.track.low i{background:var(--low)}
.track b{position:absolute;top:-4px;bottom:-4px;left:80%;width:2px;background:var(--ink);opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.days{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);padding-top:8px;overflow-x:auto}
.days .bar{flex:1 0 8px;min-width:8px;background:var(--accent);border-radius:4px 4px 0 0;position:relative;cursor:default}
.days .bar:hover,.days .bar:focus{outline:none;filter:brightness(1.15)}
.daysx{display:flex;justify-content:space-between;font:500 11px var(--f-mono);color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font:500 12px var(--f-body);padding:6px 8px;border-radius:6px;white-space:nowrap;z-index:5}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
td.qid{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.rate{display:flex;align-items:center;gap:8px;min-width:120px}
.rate .t{flex:1;height:6px;background:var(--grid);border-radius:3px;position:relative}
.rate .t i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--low)}
.rate .t.ok i{background:var(--accent)}
.rate span{font:700 12px var(--f-mono);width:38px;text-align:right}
.ans{color:var(--muted);font-size:12px;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px;line-height:1.8}
.foot{font-size:12px;color:var(--muted)}
@media (max-width:520px){.kpi .v{font-size:21px}.kpis{gap:8px}
  table{min-width:0} th:nth-child(4),td:nth-child(4){display:none}
  .rate{min-width:0;flex-direction:column;align-items:flex-end;gap:4px} .rate .t{width:48px;flex:none} .rate span{width:auto}}
</style>
<script src="config.js"></script>
</head>
<body data-exam="sec">
<div class="wrap">
  <header>
    <span class="eyebrow">おじさん問題集</span>
    <h1>みんなの集計</h1>
    <p class="sub" id="sub">送られた解答（問題番号と正誤）から集計しています。個人ごとの成績はここには表示しません。</p>
  </header>

  <div class="seg" role="group" aria-label="試験">
    <button id="b-sec" aria-pressed="true">Security+</button>
    <button id="b-net" aria-pressed="false">Network+</button>
  </div>

  <div id="body"><div class="empty">集計を読み込んでいます…</div></div>

  <p class="foot"><a href="index.html">問題集のトップへ</a>　集計は数分おきに更新されます。</p>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const Q = {"sec": {"label": "Security+", "page": "secplus.html", "domains": [{"id": 1, "name": "1.0 一般的なセキュリティ概念", "short": "1.0 概念", "w": "12%"}, {"id": 2, "name": "2.0 脅威・脆弱性・緩和策", "short": "2.0 脅威", "w": "22%"}, {"id": 3, "name": "3.0 セキュリティアーキテクチャ", "short": "3.0 アーキテクチャ", "w": "18%"}, {"id": 4, "name": "4.0 セキュリティ運用", "short": "4.0 運用", "w": "28%"}, {"id": 5, "name": "5.0 プログラム管理と監督", "short": "5.0 管理と監督", "w": "20%"}], "q": {"1-1": ["メールの送信者が、後から「そんなメールは送っていない」と言い逃れできないようにする概念はどれ？", "否認防止"], "1-2": ["AAAフレームワークのうち、認証済みユーザーが「どのリソースに何をしてよいか」を決めるのはどれ？", "認可（Authorization）"], "1-3": ["ユーザーのログイン時刻、利用時間、アクセスしたリソースを記録するAAAの要素はどれ？", "アカウンティング"], "1-4": ["セキュリティポリシーの策定やリスク評価の実施は、管理策のどのカテゴリに当たる？", "管理的（Managerial）"], "1-5": ["全従業員を対象にしたセキュリティ意識向上トレーニングは、管理策のどのカテゴリ？", "運用的（Operational）"], "1-6": ["ファイアウォールのアクセス制御ルールは、管理策のどのカテゴリに当たる？", "技術的（Technical）"], "1-7": ["建物の入口に「監視カメラ作動中」という看板を掲示した。この管理策のタイプはどれ？", "抑止的（Deterrent）"], "1-8": ["侵入検知システム（IDS）は、管理策のどのタイプに分類される？", "検知的（Detective）"], "1-9": ["ランサムウェア感染後、バックアップからシステムを復元した。この管理策のタイプは？", "是正的（Corrective）"], "1-10": ["古い制御システムにパッチを当てられないため、ネットワークを分離して保護した。この管理策のタイプは？", "補完的（Compensating）"], "1-11": ["「機密情報を私物のUSBメモリに保存してはならない」と定めたポリシー文書は、管理策のどのタイプ？", "指示的（Directive）"], "1-12": ["現在のセキュリティ態勢と、目標とするフレームワークの要件との差を洗い出す手法はどれ？", "ギャップ分析（Gap analysis）"], "1-13": ["ゼロトラストアーキテクチャで、アクセス要求を評価して許可・拒否を「判断」するコンポーネントはどれ？", "ポリシーエンジン（Policy engine）"], "1-14": ["ゼロトラストのデータプレーンにおいて、実際に通信を許可・遮断する役割を持つのはどれ？", "ポリシー施行ポイント（PEP）"], "1-15": ["ユーザーの場所、デバイスの状態、アクセス時刻などから動的にリスクを評価し、認証の厳しさを変える考え方はどれ？", "適応型アイデンティティ"], "1-16": ["ゼロトラストの基本的な考え方として最も適切なものはどれ？", "決して信頼せず、常に検証する"], "1-17": ["建物の入口前に設置し、車両の突入を物理的に防ぐ頑丈な柱はどれ？", "ボラード"], "1-18": ["2つのドアがあり、一方が閉まらないと他方が開かない構造で、共連れ（テールゲーティング）を防ぐ物理的管理策はどれ？", "アクセスベスティビュール"], "1-19": ["人体などが発する熱の変化を検知して動きを感知するセンサーはどれ？", "赤外線センサー"], "1-20": ["攻撃者をおびき寄せ、その手口を観察・記録するために意図的に用意された囮のシステムはどれ？", "ハニーポット"], "1-21": ["偽の認証情報やAPIキーをデータベースに紛れ込ませ、それが使われたら侵害を検知する手法はどれ？", "ハニートークン"], "1-22": ["ファイルサーバーに「給与一覧_2026.xlsx」という偽ファイルを置き、アクセスされたら警告するようにした。これは何？", "ハニーファイル（Honeyfile）"], "1-23": ["複数のハニーポットを組み合わせて、本物らしいネットワーク全体を囮として構築したものはどれ？", "ハニーネット"], "1-24": ["変更作業が失敗した場合に、システムを変更前の状態に戻すための手順はどれ？", "バックアウトプラン（Backout plan）"], "1-25": ["業務への影響を最小限にするため、変更作業を実施してよい時間帯として事前に決められているものはどれ？", "メンテナンスウィンドウ"], "1-26": ["変更を実施する前に、その変更がどのシステムや業務にどんな影響を与えるかを評価することを何という？", "影響分析"], "1-27": ["サーバーのOS更新後、そのサーバー上のデータベースに依存する業務アプリが起動しなくなった。変更管理で事前に確認すべきだった技術的要素は？", "依存関係（Dependencies）"], "1-28": ["設定ファイルやドキュメントの変更履歴を追跡し、必要に応じて以前の状態に戻せるようにする仕組みはどれ？", "バージョン管理"], "1-29": ["組織の変更管理プロセスにおいて、変更要求を審査し正式に承認する役割を担うのは通常どれ？", "変更諮問委員会（CAB）"], "1-30": ["暗号化と復号に同じ鍵を使う暗号方式はどれ？", "対称鍵暗号（共通鍵暗号）"], "1-31": ["公開鍵暗号を使い、AさんがBさんに機密メッセージを送る。Aさんは何でメッセージを暗号化する？", "Bさんの公開鍵"], "1-32": ["デジタル署名を作成する際に使用する鍵はどれ？", "送信者の秘密鍵"], "1-33": ["安全でない通信路上で、2者が共通鍵を安全に共有するために使われるアルゴリズムはどれ？", "Diffie-Hellman"], "1-34": ["次のうち、対称鍵暗号アルゴリズムはどれ？", "AES"], "1-35": ["短い鍵長でもRSAと同等の強度が得られ、処理能力の低いモバイル機器やIoTに向いている暗号方式はどれ？", "楕円曲線暗号（ECC）"], "1-36": ["パスワードをハッシュ化する前にランダムな値を付け加え、レインボーテーブル攻撃を困難にする手法はどれ？", "ソルト"], "1-37": ["PBKDF2やbcryptのように、ハッシュ処理を何度も繰り返して総当たり攻撃にかかる時間を増やす技術はどれ？", "キーストレッチング"], "1-38": ["画像や音声ファイルの中に、別のデータを目立たないように隠す技術はどれ？", "ステガノグラフィ"], "1-39": ["PCのマザーボードに組み込まれ、暗号鍵の保管やセキュアブート時の測定値の保持に使われるチップはどれ？", "TPM"], "1-40": ["大量の暗号鍵を安全に生成・保管し、高速な暗号処理を提供する専用のハードウェア機器はどれ？", "HSM"], "1-41": ["クラウド環境で、暗号鍵の作成・ローテーション・アクセス制御を一元的に管理するサービスはどれ？", "キー管理システム（KMS）"], "1-42": ["プロセッサ内の隔離された領域で、OSやほかのプロセスからも保護された状態で機密データを処理する仕組みはどれ？", "セキュアエンクレーブ"], "1-43": ["証明書が失効しているかどうかを、CAに対してリアルタイムで1件ずつ問い合わせるプロトコルはどれ？", "OCSP"], "1-44": ["認証局（CA）が公開する、有効期限前に失効した証明書の一覧はどれ？", "CRL"], "1-45": ["Webサーバーが、自分の証明書の失効状態をCAから事前に取得してTLSハンドシェイク時にクライアントへ提示する仕組みはどれ？", "OCSPステープリング"], "1-46": ["Webサーバー用の証明書を認証局に発行してもらうため、公開鍵と組織情報を含めて作成するものはどれ？", "証明書署名要求（CSR）"], "1-47": ["*.example.com のように、1枚の証明書で同じドメインの複数のサブドメインに使える証明書はどれ？", "ワイルドカード証明書"], "1-48": ["社内の検証環境向けに組織自身が発行し、ブラウザで「信頼されていない」と警告が出る証明書はどれ？", "自己署名証明書"], "1-49": ["PKIの階層構造において、信頼の起点（トラストアンカー）となるのはどれ？", "ルートCA（Root CA）"], "1-50": ["ノートPCの盗難に備え、OSを含むストレージ全体を暗号化する対策はどれ？", "フルディスク暗号化"], "1-51": ["データベース全体ではなく、クレジットカード番号などの特定のフィールドだけを暗号化する方法はどれ？", "レコード（フィールド）レベルの暗号化"], "1-52": ["クレジットカード番号を意味のない代替値に置き換え、元の番号は別の安全な保管庫で管理する手法はどれ？", "トークン化"], "1-53": ["コールセンターのオペレーター画面で、顧客のカード番号を「****-****-****-1234」と一部だけ表示する手法はどれ？", "データマスキング"], "1-54": ["改ざんが極めて困難な分散型の台帳で、取引の記録を参加者全員が共有する技術はどれ？", "ブロックチェーン"], "1-55": ["2つの異なる入力から、同じハッシュ値が生成されてしまう現象を何という？", "衝突（コリジョン）"], "1-56": ["現在、ファイルの完全性確認に用いるハッシュアルゴリズムとして推奨されるのはどれ？", "SHA-256"], "1-57": ["TLSのように、鍵の交換には公開鍵暗号を使い、実際のデータの暗号化には高速な共通鍵暗号を使う方式を何という？", "ハイブリッド暗号方式"], "1-58": ["同じ暗号アルゴリズムを使う場合、鍵長と安全性の一般的な関係として正しいものはどれ？", "鍵長が長いほど総当たり攻撃に強くなる"], "1-59": ["キーエスクロー（鍵の預託）の目的として最も適切なものはどれ？", "信頼できる第三者に鍵のコピーを保管し、紛失時などに復号できるようにする"], "1-60": ["ネットワーク上を流れている最中のデータ（転送中のデータ）を保護するのに最も適切な技術はどれ？", "TLS"], "2-1": ["豊富な資金と高度な技術を持ち、長期間にわたって標的に潜伏する攻撃（APT）を行うことが多い脅威アクターはどれ？", "国家支援型（Nation-state）"], "2-2": ["ネット上で入手した既成の攻撃ツールをそのまま使う、技術力の低い脅威アクターはどれ？", "スキルの低い攻撃者（Unskilled attacker）"], "2-3": ["政治的・社会的な主張を広めるために、Webサイトの改ざんやDDoS攻撃を行う脅威アクターはどれ？", "ハクティビスト"], "2-4": ["正規のアクセス権を持つ従業員が、不満から機密データを持ち出した。この脅威アクターはどれ？", "内部脅威（Insider threat）"], "2-5": ["金銭的利益を主な目的とし、ランサムウェアや詐欺を組織的に行う脅威アクターはどれ？", "組織犯罪（Organized crime）"], "2-6": ["IT部門の承認を得ずに、従業員が業務で個人契約のクラウドストレージを使っている。この状況を何という？", "シャドーIT"], "2-7": ["脅威アクターの動機のうち、競合企業の技術情報や設計データを盗み出すことを目的とするものはどれ？", "諜報活動（スパイ）"], "2-8": ["攻撃者が狙えるすべての侵入口（脆弱性やインターフェース）の総体を何という？", "攻撃対象領域（アタックサーフェス）"], "2-9": ["業者を装ってUSBメモリを社内に置き、拾った社員がPCに挿すことで感染を狙う攻撃の脅威ベクトルはどれ？", "リムーバブルデバイス"], "2-10": ["メーカーのサポートが終了し、セキュリティパッチが提供されなくなったOSを使い続けることで生じる脅威ベクトルはどれ？", "サポート外のシステムとアプリケーション"], "2-11": ["新しく導入したネットワーク機器の管理画面に、出荷時の「admin/admin」のままログインできた。この脅威ベクトルはどれ？", "デフォルトの認証情報"], "2-12": ["サーバーで使っていないサービスのポートが開いたままになっている。この状態がもたらす脅威ベクトルはどれ？", "不要なオープンポート"], "2-13": ["システム保守を委託しているMSP（マネージドサービスプロバイダ）経由で、複数の顧客企業が同時に侵害された。この攻撃の種類はどれ？", "サプライチェーン攻撃"], "2-14": ["攻撃者が電話で銀行のサポート担当を名乗り、口座の認証情報を聞き出そうとした。この攻撃はどれ？", "ビッシング（Vishing）"], "2-15": ["「荷物の配達に失敗しました」というSMSで偽サイトへ誘導する攻撃はどれ？", "スミッシング（Smishing）"], "2-16": ["攻撃者が「社長のアカウント」を乗っ取り、経理担当者に至急の送金を指示するメールを送った。この攻撃はどれ？", "ビジネスメール詐欺（BEC）"], "2-17": ["攻撃者が「IT部門の者ですが、システム更新のためパスワードを確認させてください」と、もっともらしい作り話でユーザーを信用させた。この手口はどれ？", "プリテキスティング（口実）"], "2-18": ["攻撃者が、標的企業の社員がよく訪れる業界団体のWebサイトを改ざんしてマルウェアを仕込んだ。この攻撃はどれ？", "ウォーターホール攻撃"], "2-19": ["「gooogle.com」のように、有名サイトのURLのつづり間違いを狙って偽サイトを用意する手口はどれ？", "タイポスクワッティング"], "2-20": ["有名企業のロゴやデザインをそっくり真似た偽サイトや偽SNSアカウントで、ユーザーをだます手口はどれ？", "ブランドなりすまし（Brand impersonation）"], "2-21": ["プログラムが確保したメモリ領域を超えるデータを書き込ませ、隣接メモリを上書きして任意のコードを実行させる脆弱性はどれ？", "バッファオーバーフロー"], "2-22": ["ファイルの権限をチェックした時点と、そのファイルを実際に使う時点の間に、攻撃者がファイルを差し替える脆弱性はどれ？", "レースコンディション（TOCTOU）"], "2-23": ["正規のソフトウェア更新の仕組みが乗っ取られ、マルウェアを含むアップデートが配布された。この脆弱性の種類はどれ？", "悪意のあるアップデート"], "2-24": ["ログインフォームのユーザー名欄に「' OR '1'='1」と入力され、認証が回避された。この攻撃はどれ？", "SQLインジェクション"], "2-25": ["掲示板の投稿欄に悪意あるJavaScriptを埋め込み、閲覧した他のユーザーのブラウザでスクリプトを実行させる攻撃はどれ？", "クロスサイトスクリプティング（XSS）"], "2-26": ["仮想マシン上で動作するマルウェアが、ハイパーバイザーやホストOSにアクセスできてしまう脆弱性はどれ？", "VMエスケープ"], "2-27": ["仮想環境で、解放されたメモリやストレージが消去されないまま別のVMに割り当てられ、前の利用者のデータが見えてしまう脆弱性はどれ？", "リソースの再利用"], "2-28": ["スマートフォンで、公式ストア以外から入手したアプリをインストールすることを何という？", "サイドローディング"], "2-29": ["iPhoneのOSの制限を解除し、メーカーが許可していない操作やアプリを使えるようにすることを何という？", "ジェイルブレイク"], "2-30": ["ベンダーもまだ把握しておらず、修正パッチが存在しない脆弱性を何という？", "ゼロデイ脆弱性"], "2-31": ["クラウドストレージのバケットが誤って「公開」に設定され、顧客データが誰でも閲覧できる状態になっていた。この脆弱性はどれ？", "設定ミス（Misconfiguration）"], "2-32": ["サポート期限（EOL）を過ぎたルーターのファームウェアに脆弱性が見つかったが、修正版は提供されない。この脆弱性の分類はどれ？", "ハードウェア（ファームウェア／EOL）の脆弱性"], "2-33": ["ファイルが突然開けなくなり、拡張子が変わって「復号したければ暗号資産を支払え」というメッセージが表示された。このマルウェアはどれ？", "ランサムウェア"], "2-34": ["便利な無料ツールのふりをしてダウンロードさせ、裏でバックドアを設置するマルウェアはどれ？", "トロイの木馬"], "2-35": ["ユーザーの操作なしに、ネットワーク経由で脆弱性を突いて自己増殖していくマルウェアはどれ？", "ワーム"], "2-36": ["ユーザーに気づかれないよう、閲覧履歴や入力情報などを収集して外部に送信するマルウェアはどれ？", "スパイウェア"], "2-37": ["新品のPCにメーカーが最初から入れている、ほとんど使わない大量のアプリケーションを何という？", "ブロートウェア"], "2-38": ["キーボードの入力を記録し、パスワードやクレジットカード番号を盗み取るマルウェアはどれ？", "キーロガー"], "2-39": ["退職予定のシステム管理者が「自分の名前が人事DBから消えたら全データを削除する」コードを仕込んだ。このマルウェアはどれ？", "ロジックボム"], "2-40": ["OSのカーネルレベルに潜り込み、自身の存在を隠しつつ管理者権限を維持するマルウェアはどれ？", "ルートキット"], "2-41": ["正規ファイルに自身のコードを付着させ、ユーザーがそのファイルを実行したときに感染を広げるマルウェアはどれ？", "ウイルス"], "2-42": ["ハードディスク上にファイルを残さず、メモリ上やPowerShellなどの正規ツールだけで動作するマルウェアはどれ？", "ファイルレスマルウェア"], "2-43": ["入館カードの電波情報を読み取って複製し、不正に建物へ入る攻撃はどれ？", "RFIDクローニング"], "2-44": ["サーバールームの空調を故意に停止させ、機器を過熱させて停止に追い込む攻撃の種類はどれ？", "環境への攻撃"], "2-45": ["攻撃者が送信元IPを標的に偽装して多数のDNSサーバーに小さな問い合わせを送り、大きな応答を標的に集中させた。この攻撃はどれ？", "増幅型（リフレクション）DDoS攻撃"], "2-46": ["DNSキャッシュに偽の情報を注入し、利用者を正規のドメイン名から偽サイトへ誘導する攻撃はどれ？", "DNSポイズニング"], "2-47": ["カフェで、本物の公衆Wi-Fiと同じSSIDのアクセスポイントを攻撃者が設置し、利用者の通信を盗聴した。この攻撃はどれ？", "イービルツイン"], "2-48": ["攻撃者が通信経路の間に入り込み、両者に気づかれずに通信を盗聴・改ざんする攻撃はどれ？", "オンパス攻撃（中間者攻撃）"], "2-49": ["盗聴した正規の認証データをそのまま再送信して、なりすましてログインする攻撃はどれ？", "リプレイ攻撃"], "2-50": ["ログイン済みのユーザーに罠のリンクを踏ませ、本人の意図しない送金や設定変更をWebアプリに実行させる攻撃はどれ？", "クロスサイトリクエストフォージェリ（CSRF）"], "2-51": ["Webサーバーに細工したURLを送り、そのサーバーから社内の内部システムやクラウドのメタデータサービスにリクエストを送らせる攻撃はどれ？", "サーバーサイドリクエストフォージェリ（SSRF）"], "2-52": ["URLのパラメータに「../../etc/passwd」を指定して、公開ディレクトリ外のファイルを読み取ろうとする攻撃はどれ？", "ディレクトリトラバーサル"], "2-53": ["一般ユーザーの権限でログインした攻撃者が、脆弱性を悪用して管理者権限を取得した。この攻撃はどれ？", "権限昇格（垂直）"], "2-54": ["通信相手に古く脆弱なバージョンのTLSや弱い暗号スイートを使わせるよう仕向ける攻撃はどれ？", "ダウングレード攻撃"], "2-55": ["攻撃者が「Password2026!」のようなよく使われるパスワード1つを、多数のアカウントに対して順番に試した。この攻撃はどれ？", "パスワードスプレー"], "2-56": ["攻撃者が1つのアカウントに対し、文字の組み合わせを総当たりで試し続けた。この攻撃はどれ？", "ブルートフォース攻撃"], "2-57": ["他のサイトから流出したIDとパスワードの組み合わせを、別のサービスで大量に試すことで不正ログインする攻撃はどれ？", "クレデンシャルスタッフィング"], "2-58": ["攻撃者が盗んだパスワードのハッシュ値を、平文に戻さずそのまま認証に使ってログインした。この攻撃はどれ？", "パス・ザ・ハッシュ"], "2-59": ["事前に計算したハッシュ値と平文の対応表を使い、パスワードハッシュから元のパスワードを高速に割り出す攻撃はどれ？", "レインボーテーブル攻撃"], "2-60": ["ハッシュ関数で衝突が見つかる確率は、予想よりずっと高いという数学的性質を利用した攻撃はどれ？", "誕生日攻撃"], "2-61": ["あるユーザーが東京からログインした10分後に、ブラジルからログインした記録があった。この侵害の兆候はどれ？", "不可能な移動（Impossible travel）"], "2-62": ["1人のユーザーアカウントで、普段はありえない複数の場所・端末から同時にログインしているのが確認された。この兆候はどれ？", "同時セッションの使用"], "2-63": ["多くのユーザーから「パスワードを入力していないのにアカウントがロックされた」と問い合わせが相次いだ。最も疑われるのはどれ？", "ブルートフォースまたはパスワードスプレー攻撃"], "2-64": ["サーバーのCPU使用率が深夜に急上昇し、身に覚えのない外部への大量通信が発生していた。この侵害の兆候はどれ？", "リソースの消費"], "2-65": ["監査の時期でもないのに、セキュリティログが深夜に大量に削除された形跡があった。この兆候はどれ？", "ログの欠落"], "2-66": ["ダークWebのフォーラムに、自社の顧客データとみられる情報が売りに出されているのが見つかった。この侵害の兆候はどれ？", "公開・文書化された情報（Published/documented）"], "2-67": ["ユーザーが社内のファイルサーバーに急にアクセスできなくなり、ファイル名が意味不明な文字列に変わっていた。最も可能性が高い原因はどれ？", "ランサムウェア感染によるリソースのアクセス不能"], "2-68": ["無線LANのアクセスポイントに大量の妨害電波を送り、通信をできなくする攻撃はどれ？", "ジャミング"], "2-69": ["攻撃者が偽の切断（認証解除）フレームを送り、ユーザーを無線LANから強制的に切断させる攻撃はどれ？", "認証解除（Deauthentication）攻撃"], "2-70": ["Bluetoothの脆弱性を利用し、相手のスマートフォンから連絡先などのデータを無断で盗み出す攻撃はどれ？", "ブルースナーフィング"], "2-71": ["Bluetooth経由で、近くにいる人の端末に一方的に迷惑メッセージを送りつける行為はどれ？", "ブルージャッキング"], "2-72": ["攻撃者が偽のARP応答を送り、デフォルトゲートウェイのIPアドレスと自分のMACアドレスを対応付けさせた。この攻撃はどれ？", "ARPポイズニング"], "2-73": ["大量の偽のMACアドレスを送りつけてスイッチのアドレステーブルをあふれさせ、すべての通信をブロードキャストさせる攻撃はどれ？", "MACフラッディング"], "2-74": ["攻撃者がドメインのレジストラアカウントを乗っ取り、DNSの登録情報を書き換えてWebサイトを自分のサーバーに向けた。この攻撃はどれ？", "ドメインハイジャック"], "2-75": ["実行中の正規プロセスのメモリ空間に悪意あるコードを書き込み、そのプロセスとして動作させる攻撃はどれ？", "メモリインジェクション（Memory injection）"], "2-76": ["Webアプリが、ユーザー入力をそのままOSのコマンドに渡していたため、「; rm -rf /」のような入力でサーバー上のコマンドが実行された。この攻撃はどれ？", "コマンドインジェクション"], "2-77": ["ディレクトリサービスに問い合わせる検索条件にユーザー入力を組み込み、認証を回避したり情報を抜き出したりする攻撃はどれ？", "LDAPインジェクション"], "2-78": ["攻撃者がユーザーのセッションIDを盗み、そのIDを使ってログイン済みのユーザーになりすました。この攻撃はどれ？", "セッションハイジャック"], "2-79": ["透明なiframeを正規のボタンの上に重ねて、ユーザーに意図しない操作をクリックさせる攻撃はどれ？", "クリックジャッキング"], "2-80": ["攻撃者が、従業員がパスワードを入力しているところを背後からのぞき見た。この手口はどれ？", "ショルダーハッキング（ショルダーサーフィン）"], "2-81": ["攻撃者が会社のゴミ捨て場をあさり、シュレッダーにかけられていない社内資料から組織図や電話番号を入手した。この手口はどれ？", "ダンプスターダイビング"], "2-82": ["攻撃者が、社員証をかざして入館する社員のすぐ後ろについて、認証なしで建物に入った。この手口はどれ？", "テールゲーティング"], "2-83": ["SNS上で虚偽の情報を意図的に拡散し、企業の評判を落とそうとする行為はどれ？", "偽情報（ディスインフォメーション）"], "2-84": ["攻撃者が配送業者の制服を着て、荷物を届けるふりをしてオフィスに入り込んだ。この手口はどれ？", "なりすまし（Impersonation）"], "2-85": ["画像ファイルの中にマルウェアのコードを埋め込み、メールで送りつける攻撃の脅威ベクトルはどれ？", "画像ベース"], "2-86": ["社内ネットワークを部署ごとのVLANに分割し、侵害が発生しても他の部署へ広がりにくくした。この緩和策はどれ？", "セグメンテーション"], "2-87": ["事前に承認したアプリケーションだけを実行可能にし、それ以外はすべてブロックする緩和策はどれ？", "アプリケーション許可リスト"], "2-88": ["マルウェア感染が疑われる端末を、調査のため他のネットワークから切り離した。この緩和策はどれ？", "隔離（Isolation）"], "2-89": ["ユーザーには業務に必要な最小限の権限のみを付与する原則はどれ？", "最小権限の原則"], "2-90": ["グループポリシーで全端末のセキュリティ設定を強制し、ユーザーが勝手に変更できないようにした。この緩和策はどれ？", "構成の強制（Configuration enforcement）"], "2-91": ["使わなくなったサーバーを、データを消去したうえでネットワークから撤去した。この緩和策はどれ？", "廃棄・運用停止（Decommissioning）"], "2-92": ["エンドポイントの挙動を継続的に監視し、不審な動作を検知して自動で隔離・調査できるツールはどれ？", "EDR"], "2-93": ["個々のサーバー上で通信を監視し、既知の攻撃パターンを検知するとその通信をブロックする仕組みはどれ？", "HIPS（ホスト型侵入防止システム）"], "2-94": ["サーバーの堅牢化（ハードニング）として最も適切でないものはどれ？", "管理を楽にするため全ポートを開放する"], "2-95": ["パッチ適用を緩和策として行う主な目的はどれ？", "既知の脆弱性を修正して悪用を防ぐ"], "2-96": ["Webサーバーへの攻撃の兆候として、ログに「%3Cscript%3E」のようなエンコードされた文字列が大量に記録されていた。最も疑われる攻撃はどれ？", "クロスサイトスクリプティング"], "2-97": ["Webサーバーのログに「GET /../../../../windows/win.ini」というリクエストが記録されていた。最も疑われる攻撃はどれ？", "ディレクトリトラバーサル"], "2-98": ["ログに「' UNION SELECT username, password FROM users--」というパラメータを含むリクエストが記録されていた。最も疑われる攻撃はどれ？", "SQLインジェクション"], "2-99": ["メールのリンクをクリックした社員の端末が、外部の不審なサーバーと定期的に通信を始めた。この通信の目的として最も考えられるものはどれ？", "コマンド＆コントロール（C2）サーバーとの通信"], "2-100": ["多数の乗っ取られた端末が攻撃者の指示で一斉に動き、標的にDDoS攻撃を仕掛けた。この乗っ取られた端末群を何という？", "ボットネット"], "2-101": ["攻撃者がTCPの接続要求（SYN）を大量に送り、応答待ちの状態をあふれさせてサーバーを応答不能にする攻撃はどれ？", "SYNフラッド攻撃"], "2-102": ["暗号化プロトコルの実装で、古いバージョンのSSL/TLSを有効にしたままにしていることで生じる脆弱性の分類はどれ？", "暗号の脆弱性"], "2-103": ["クラウド環境で、APIキーがソースコードに直書きされたまま公開リポジトリに置かれていた。この脆弱性として最も適切なものはどれ？", "クラウド固有の設定・管理の脆弱性（シークレットの露出）"], "2-104": ["ソフトウェアに組み込まれたオープンソースライブラリに脆弱性が見つかり、多くの製品が影響を受けた。この脆弱性の分類はどれ？", "サプライチェーン（ソフトウェア依存関係）の脆弱性"], "2-105": ["フィッシング攻撃に対する最も効果的な「人」への対策はどれ？", "意識向上トレーニングと模擬フィッシング訓練"], "2-106": ["攻撃者がネットワークの1台の端末に侵入した後、そこを足がかりに社内の他のサーバーへ次々と侵入を広げていく行為を何という？", "ラテラルムーブメント（横展開）"], "2-107": ["ある従業員が、本来必要ないはずの人事データベースに夜間アクセスを繰り返していることが検知された。この種の異常を見つけるのに最も適した仕組みはどれ？", "ユーザー行動分析（UBA/UEBA）"], "2-108": ["マルウェアに感染したとみられる添付ファイルを、本番環境に影響を与えずに実行して挙動を観察するための隔離環境はどれ？", "サンドボックス"], "2-109": ["攻撃者がSNSや企業サイトを調べ、標的の社員の氏名・役職・メールアドレスの形式を収集した。攻撃のどの段階に当たる？", "偵察（Reconnaissance）"], "3-1": ["IaaSを利用する場合、仮想マシンのOSへのパッチ適用の責任は通常誰にある？", "クラウドの利用者（顧客）"], "3-2": ["SaaSを利用する場合でも、利用者側の責任として残るものはどれ？", "ユーザーアカウントとアクセス権の管理"], "3-3": ["自社のデータセンターとパブリッククラウドを組み合わせて利用する形態はどれ？", "ハイブリッドクラウド"], "3-4": ["サーバーやネットワークの構成をコードで定義し、同じ環境を繰り返し自動で構築できるようにする手法はどれ？", "Infrastructure as Code"], "3-5": ["利用者がサーバーを管理せず、イベント発生時にだけコードが実行されて実行時間分だけ課金されるクラウドの形態はどれ？", "サーバーレス"], "3-6": ["1つの大きなアプリケーションを、独立して開発・デプロイできる小さなサービスの集まりとして構成する設計はどれ？", "マイクロサービスアーキテクチャ"], "3-7": ["機密性の極めて高いシステムを、インターネットや他のネットワークから物理的に完全に切り離す手法はどれ？", "エアギャップ"], "3-8": ["ネットワーク機器の制御機能（コントロールプレーン）とデータ転送機能を分離し、ソフトウェアで一元的に制御するネットワークはどれ？", "SDN（ソフトウェア定義ネットワーク）"], "3-9": ["アプリケーションとその依存ライブラリをまとめてパッケージ化し、ホストOSのカーネルを共有して軽量に動作させる技術はどれ？", "コンテナ"], "3-10": ["工場の生産ラインや電力網などの物理設備を監視・制御するシステムの総称はどれ？", "ICS／SCADA"], "3-11": ["自動車のブレーキ制御や医療機器のように、決められた時間内に必ず処理を完了しなければならないシステムで使われるOSはどれ？", "RTOS（リアルタイムOS）"], "3-12": ["スマート家電やネットワークカメラなどのIoT機器に共通するセキュリティ上の課題として最も適切なものはどれ？", "初期パスワードのまま使われやすく、更新が提供されにくい"], "3-13": ["システムやサービスを停止させずに稼働し続けられる能力、つまり高い稼働率を確保する設計の考え方はどれ？", "高可用性（High availability）"], "3-14": ["利用者の増加に応じて、サーバーの台数や処理能力を柔軟に増やせる性質を何という？", "スケーラビリティ"], "3-15": ["組み込み機器のように、脆弱性が見つかってもパッチを適用できない場合に優先して検討すべきことはどれ？", "ネットワーク分離などの補完的管理策"], "3-16": ["社内ネットワークの中で、インターネットに公開するWebサーバーを配置するために設ける中間のネットワークゾーンはどれ？", "スクリーンドサブネット（DMZ）"], "3-17": ["ファイアウォールが故障したとき、すべての通信を遮断する動作を何という？", "フェールクローズ（Fail-closed）"], "3-18": ["IPSが故障した際に、業務を止めないようすべての通信を通過させる動作を何という？", "フェールオープン（Fail-open）"], "3-19": ["通信経路の途中に設置され、トラフィックを直接通過させながら検査・遮断できる機器の配置を何という？", "インライン（アクティブ）"], "3-20": ["通信のコピー（ミラー）を受け取って監視するだけで、通信そのものには影響を与えない機器の配置を何という？", "タップ／モニター（パッシブ）"], "3-21": ["管理者が重要なサーバーを管理するとき、必ず経由させる堅牢化された中継用のサーバーはどれ？", "ジャンプサーバー（踏み台サーバー）"], "3-22": ["社内ユーザーのWebアクセスを代理で行い、URLフィルタリングやキャッシュを提供するサーバーはどれ？", "フォワードプロキシ"], "3-23": ["インターネットからのリクエストを受け取り、背後にある複数のWebサーバーへ振り分けて負荷を分散する機器はどれ？", "ロードバランサー"], "3-24": ["スイッチのポートに接続した端末が、RADIUSサーバーで認証されるまでネットワークを使えないようにする規格はどれ？", "IEEE 802.1X"], "3-25": ["802.1X認証の構成要素で、認証を受ける端末を何と呼ぶ？", "サプリカント"], "3-26": ["SQLインジェクションやXSSなど、Webアプリケーション層の攻撃を検査・遮断する専用のファイアウォールはどれ？", "WAF（Webアプリケーションファイアウォール）"], "3-27": ["アプリケーションの識別、IPS、URLフィルタリングなどの機能を1台に統合したファイアウォールはどれ？", "次世代ファイアウォール（NGFW）"], "3-28": ["ファイアウォール、アンチウイルス、スパムフィルタ、VPNなど複数のセキュリティ機能を1台にまとめた機器で、中小企業でよく使われるものはどれ？", "UTM（統合脅威管理）"], "3-29": ["IPアドレスとポート番号（OSI参照モデルの第4層）だけを見て通信を許可・拒否するファイアウォールはどれ？", "レイヤー4ファイアウォール"], "3-30": ["在宅勤務の社員が、インターネット経由で社内ネットワークに安全に接続するための仕組みはどれ？", "リモートアクセスVPN"], "3-31": ["IPsecで、パケット全体を暗号化して新しいIPヘッダーを付ける、サイト間VPNでよく使われるモードはどれ？", "トンネルモード"], "3-32": ["IPsecで、データの暗号化を行わず、送信元の認証と完全性のみを提供するプロトコルはどれ？", "AH（認証ヘッダー）"], "3-33": ["複数の拠点のWAN回線（MPLS、ブロードバンド、LTEなど）をソフトウェアで一元管理し、最適な経路を選ぶ技術はどれ？", "SD-WAN"], "3-34": ["ネットワーク機能とセキュリティ機能（SWG、CASB、ZTNA、FWaaSなど）をクラウドから統合して提供するアーキテクチャはどれ？", "SASE（セキュアアクセスサービスエッジ）"], "3-35": ["個人の健康情報（PHI）やクレジットカード情報のように、法律や規制で保護が義務付けられているデータの種類はどれ？", "規制対象データ（Regulated）"], "3-36": ["コカ・コーラのレシピのように、公開せず秘密にすることで競争上の優位性を保っている情報の種類はどれ？", "営業秘密（Trade secret）"], "3-37": ["組織のデータ分類で、漏洩すると組織に深刻な損害を与えるため、最も厳しいアクセス制限が必要な区分はどれ？", "機密（Confidential）"], "3-38": ["データベースに保存されているデータは、データの3つの状態のうちどれに当たる？", "保存中（At rest）"], "3-39": ["アプリケーションがメモリ上で処理しているデータは、データの3つの状態のうちどれに当たる？", "使用中（In use）"], "3-40": ["EU市民の個人データは、EU域内の法律が適用されるという考え方のように、データが保存されている国の法律に従うという概念はどれ？", "データ主権（Data sovereignty）"], "3-41": ["特定の国や地域からのアクセスを制限したり、データを特定の地域内にだけ保存したりする管理策はどれ？", "地理的制限（ジオフェンシング／ジオロケーション）"], "3-42": ["暗号化されたデータを復号せずに計算処理できる暗号方式で、使用中のデータの保護に役立つものはどれ？", "準同型暗号"], "3-43": ["社外秘ファイルへのアクセスを人事部のグループだけに許可するなど、データを守るために閲覧・編集できる人を絞る方法はどれ？", "権限の制限（Permission restrictions）"], "3-44": ["機密データを含むシステムを、他のシステムとは別のネットワークやストレージに分けて保管するデータ保護の方法はどれ？", "セグメンテーション（データの分離）"], "3-45": ["電源・空調・ネットワーク・最新データがすべて揃っており、障害発生後すぐに業務を引き継げるバックアップサイトはどれ？", "ホットサイト"], "3-46": ["建物と電源・空調はあるが、サーバーや通信機器などの設備がなく、復旧に時間がかかる最も安価なバックアップサイトはどれ？", "コールドサイト"], "3-47": ["一部の機器は設置済みだが、最新データの復元や設定作業が必要で、ホットとコールドの中間に当たるバックアップサイトはどれ？", "ウォームサイト"], "3-48": ["大規模な自然災害で本社とバックアップサイトが同時に被災するのを避けるため、拠点を離れた地域に置く考え方はどれ？", "地理的分散"], "3-49": ["1つのOSやベンダーの脆弱性で全システムが同時に停止しないよう、異なるOSや製品を組み合わせて使う考え方はどれ？", "プラットフォームの多様性"], "3-50": ["1つのクラウド事業者の大規模障害に備え、複数のクラウド事業者のサービスを組み合わせて利用する形態はどれ？", "マルチクラウド"], "3-51": ["大規模災害時にも組織の重要な機能を継続させるための計画で、主に政府機関などで使われる用語はどれ？", "運用継続計画（COOP）"], "3-52": ["繁忙期の需要増加に備え、必要となる人員・技術・インフラの量を事前に見積もっておく活動はどれ？", "容量計画（Capacity planning）"], "3-53": ["災害復旧計画の関係者が会議室に集まり、シナリオに沿って各自の対応を口頭で確認する訓練はどれ？", "卓上演習（テーブルトップ）"], "3-54": ["本番システムを停止させて、実際にバックアップ系へ切り替わるかを確かめる試験はどれ？", "フェールオーバーテスト"], "3-55": ["本番システムを動かしたまま、バックアップサイトでも同じ処理を並行して実行し、結果が一致するかを確認する試験はどれ？", "並列処理テスト"], "3-56": ["バックアップの方式で、前回のフルバックアップ以降に変更されたすべてのデータを毎回保存する方式はどれ？", "差分バックアップ"], "3-57": ["バックアップの方式で、前回のバックアップ（種類を問わず）以降に変更されたデータだけを保存し、取得時間と容量が最も少ない方式はどれ？", "増分バックアップ"], "3-58": ["ある時点の仮想マシンやストレージの状態を丸ごと記録し、素早くその時点へ戻せるようにする仕組みはどれ？", "スナップショット"], "3-59": ["データを別のサイトのストレージへリアルタイムまたはほぼリアルタイムでコピーし続け、データ損失を最小にする仕組みはどれ？", "レプリケーション"], "3-60": ["データベースへの変更内容を時系列で記録しておき、障害時にその記録を再生して整合性のある状態に復旧する仕組みはどれ？", "ジャーナリング"], "3-61": ["ランサムウェア対策として、バックアップに関して最も重要な考え方はどれ？", "ネットワークから切り離したオフライン（またはイミュータブル）なコピーを保持する"], "3-62": ["バックアップデータを保管する際、盗難や紛失に備えて実施すべき対策はどれ？", "バックアップデータの暗号化"], "3-63": ["バックアップが正しく取れているかを確かめるために、最も確実な方法はどれ？", "定期的に実際の復元テストを行う"], "3-64": ["停電が発生した瞬間から、非常用発電機が起動するまでの短い時間、サーバーへ電力を供給し続ける装置はどれ？", "UPS（無停電電源装置）"], "3-65": ["数時間〜数日の長期停電に備え、データセンターに電力を供給し続けるための設備はどれ？", "非常用発電機"], "3-66": ["複数のサーバーが互いの状態を監視し、1台が故障すると別のサーバーが処理を引き継ぐ構成で、ロードバランサーとは異なり共有ストレージを使うことが多いものはどれ？", "クラスタリング"], "3-67": ["人が読むことを前提としていない、機械処理用のバイナリ形式やバーコードのようなデータの種類はどれ？", "人間が読めないデータ（Non-human-readable）"], "3-68": ["社員の給与明細や顧客の口座情報のような、金融取引や財務状況に関するデータの種類はどれ？", "財務情報"], "3-69": ["係争中の訴訟に関する文書や弁護士とのやり取りのような、取り扱いに注意が必要なデータの種類はどれ？", "法的情報"], "3-70": ["会社のWebサイトに掲載している製品カタログのように、誰が見ても問題ないデータの分類はどれ？", "パブリック（公開）"], "3-71": ["個人の住所や電話番号など、主に個人に関わる情報で、組織外に公開すべきでないデータの分類はどれ？", "プライベート"], "3-72": ["組織の事業継続に不可欠で、失われたり使えなくなったりすると業務が停止するデータの分類はどれ？", "クリティカル（重要）"], "3-73": ["ネットワーク設計で、セキュリティ要件が同じシステムをまとめ、ゾーン間の通信をファイアウォールで制御する考え方はどれ？", "セキュリティゾーン"], "3-74": ["IPSやファイアウォールなどのセキュリティ機器を配置する場所を検討する際、最も重要な考え方はどれ？", "守る対象と信頼境界（ゾーンの境目）に合わせて配置する"], "3-75": ["ネットワークの通信量やエラーを収集するために、各所に設置してデータをSIEMなどに送る機器を何という？", "センサー"], "3-76": ["サーバールームやデータセンターに中央集権型のアーキテクチャを採用した場合の主なデメリットとして最も適切なものはどれ？", "単一障害点になりやすい"], "3-77": ["自社のサーバールームで機器を所有・運用するオンプレミス環境の、クラウドと比べた主な特徴はどれ？", "セキュリティの管理を自社で完全にコントロールできるが、すべての責任とコストを負う"], "3-78": ["クラウドサービスに移行することで、データセンターの物理的なセキュリティや設備故障のリスクを事業者に移すことは、リスク対応のどれに当たる？", "リスク移転"], "3-79": ["システムのアーキテクチャを選ぶ際、障害発生後にどれだけ簡単かつ迅速に元の状態へ戻せるかという観点を何という？", "復旧の容易さ（Ease of recovery）"], "3-80": ["ユーザーの要求に対して、システムがどれだけ速く反応できるかというアーキテクチャの考慮点はどれ？", "応答性（Responsiveness）"], "3-81": ["障害や攻撃を受けても、機能を維持したり速やかに回復したりできるシステムの性質を何という？", "回復力（レジリエンス）"], "3-82": ["物理サーバー1台の上で複数の仮想マシンを動かす仮想化環境の、セキュリティ上の主な懸念点はどれ？", "ハイパーバイザーが侵害されると全VMに影響が及ぶ"], "3-83": ["組み込みシステムや一部のIoT機器を設計する際、セキュリティ機能の実装を制限する主な要因として最も適切なものはどれ？", "電力・計算能力・メモリなどのリソースの制約"], "3-84": ["社内の業務アプリケーションを利用者のPCではなくデータセンター上の仮想デスクトップで動かし、端末には画面だけを表示させる仕組みの主なセキュリティ上の利点はどれ？", "データが端末に残らず、一元的に管理できる"], "3-85": ["サードパーティのクラウドサービスを利用する際、事業者側のセキュリティ対策を確認するために最も適した方法はどれ？", "SOC 2などの第三者監査報告書を確認する"], "3-86": ["クラウド上の仮想ネットワークで、インスタンス単位に適用されるステートフルなファイアウォール機能を何という？", "セキュリティグループ"], "3-87": ["社内ネットワークと工場の制御ネットワークを接続する必要がある場合に、最も適切な設計はどれ？", "両者の間にファイアウォールを置き、必要最小限の通信だけを許可する"], "3-88": ["アーキテクチャ選定時の考慮点として、新しい拠点やサービスにどれだけ素早く簡単にシステムを導入できるかを表すものはどれ？", "展開の容易さ（Ease of deployment）"], "3-89": ["システムを選ぶ際、ベンダーが継続的にセキュリティ更新を提供しているかどうかを確認する観点を何という？", "パッチの可用性"], "3-90": ["TLSで暗号化されたHTTPS通信の中身を、社内のプロキシやNGFWでマルウェア検査するために必要な処理はどれ？", "TLSインスペクション（SSL復号）"], "3-91": ["データ保護の手法で、ソースコードの変数名を意味のない文字列に置き換えるなど、内容を理解しにくくする手法はどれ？", "難読化（Obfuscation）"], "4-1": ["新しく導入するサーバーすべてに同じセキュリティ設定を適用するため、事前に定めておく標準的な構成を何という？", "セキュアベースライン"], "4-2": ["ベースライン適用後、サーバーの設定が時間とともに基準から外れていないかを確認する活動はどれ？", "ベースラインの維持（構成ドリフトの検出）"], "4-3": ["スイッチやルーターの堅牢化として、最も適切なものはどれ？", "管理アクセスにSSHを使い、Telnetを無効化する"], "4-4": ["無線LANのアクセスポイントを設置する前に、電波の強さや干渉を調べて最適な設置場所を決める作業はどれ？", "サイトサーベイ"], "4-5": ["無線LANの電波強度をフロア図面上に色分けして表示し、カバー範囲や死角を可視化したものはどれ？", "ヒートマップ"], "4-6": ["社員が会社支給のスマートフォンを使い、紛失時に遠隔でデータを消去できるようにしたい。最も適した仕組みはどれ？", "MDM（モバイルデバイス管理）"], "4-7": ["社員が個人所有のスマートフォンを業務に使う導入モデルはど に新入社員が登録されると、自動的に必要なアカウントと権限が作成されるようにした。この自動化の主なメリットはどれ？", "作業の効率化と、手作業による設定ミスの削減"], "4-104": ["セキュリティの自動化を導入する際に考慮すべき「デメリット・注意点」として最も適切なものはどれ？", "仕組みが複雑になり、自動化そのものが単一障害点になりうる"], "4-105": ["クラウドでリソースを作成する際、暗号化されていないストレージや公開設定のバケットを自動的に作れないようにする仕組みを何という？", "ガードレール"], "4-106": ["SIEMで重大なアラートが発生した際に、チケット管理システムへ自動で起票し、担当者にエスカレーションする仕組みは、自動化のどのユースケースに当たる？", "チケットの作成とエスカレーション"], "4-107": ["インシデント対応プロセスの正しい順番はどれ？", "準備 → 検知 → 分析 → 封じ込め → 根絶 → 復旧 → 教訓"], "4-108": ["マルウェアに感染した端末を発見した。インシデント対応で最初に行うべきこととして最も適切なものはどれ？", "端末をネットワークから隔離して被害の拡大を防ぐ"], "4-109": ["感染端末からマルウェアを完全に取り除き、攻撃者が作ったアカウントやバックドアを削除する段階はどれ？", "根絶（Eradication）"], "4-110": ["インシデント対応が終わった後、関係者が集まって何がうまくいき何を改善すべきかを話し合う段階はどれ？", "教訓（Lessons learned）"], "4-111": ["インシデント対応チームの編成、連絡先リストの作成、対応ツールの用意などを行う段階はどれ？", "準備（Preparation）"], "4-112": ["インシデントの根本原因を特定し、同じ問題が再発しないようにするために行う分析はどれ？", "根本原因分析（RCA）"], "4-113": ["アラートを待つのではなく、まだ検知されていない脅威が環境内に潜んでいないかを、仮説を立てて能動的に探す活動はどれ？", "スレットハンティング"], "4-114": ["インシデント対応チームが、本物のシステムを使って攻撃を受けた状況を再現し、実際に対応手順を実行してみる訓練はどれ？", "シミュレーション"], "4-115": ["訴訟が予想される場合に、関連するデータやメールを削除・改変しないよう保全を命じることを何という？", "リーガルホールド（訴訟ホールド）"], "4-116": ["証拠を収集してから法廷に提出するまでに、誰がいつ証拠を扱ったかをすべて記録し、改ざんされていないことを証明する手続きはどれ？", "証拠保全の連鎖（Chain of custody）"], "4-117": ["デジタルフォレンジックで証拠を取得する際、揮発性の高いものから順に収集すべきとされる。最初に取得すべきものはどれ？", "CPUのレジスタとキャッシュ、メモリの内容"], "4-118": ["フォレンジック調査で、元のディスクを直接調べず、ビット単位で完全な複製を作成し、ハッシュ値で一致を確認してから複製を調べる理由はどれ？", "元の証拠の完全性を保ち、改変していないことを証明するため"], "4-119": ["訴訟の相手方から求められ、関係する電子メールや文書などの電子データを特定・収集・提出するプロセスはどれ？", "e-ディスカバリー（電子情報開示）"], "4-120": ["フォレンジック調査の結果をまとめる報告書に求められることとして、最も適切なものはどれ？", "事実に基づき、実施した手順と根拠を再現可能な形で記載する"], "4-121": ["Webサーバーへの不正アクセスを調査する際、攻撃者のIPアドレスやアクセスしたURL、HTTPステータスを確認するのに最も役立つデータ源はどれ？", "Webサーバー（アプリケーション）のアクセスログ"], "4-122": ["特定の端末から外部への通信が、ファイアウォールで許可されたか拒否されたかを確認したい。最も適したデータ源はどれ？", "ファイアウォールのログ"], "4-123": ["Windowsサーバーで、誰がいつログオンに失敗したかを調べたい。最も適したデータ源はどれ？", "OSのセキュリティイベントログ"], "4-124": ["IPSのログで、ある攻撃シグネチャに一致した通信が検知・遮断された記録を確認した。このデータから分かることとして最も適切なものはどれ？", "どの攻撃が、どこからどこへ行われたか"], "4-125": ["ネットワークの通信を丸ごと記録し、後から実際のペイロード（データの中身）まで詳細に分析できるデータ源はどれ？", "パケットキャプチャ"], "4-126": ["ファイルの作成日時・更新者・サイズなど、データそのものではなくデータに関する情報で、調査に役立つものを何という？", "メタデータ"], "4-127": ["経営層に、組織のセキュリティ状況や未対応の脆弱性の推移を一目で分かるように示すのに最も適したものはどれ？", "ダッシュボード"], "4-128": ["インシデント発生時に、ランサムウェア感染やフィッシングなど攻撃の種類ごとに、具体的な対応手順を定めた文書はどれ？", "プレイブック"], "4-129": ["インシデント対応で、攻撃者のC2サーバーへの通信をファイアウォールで遮断し、感染端末をVLANで隔離した。これはどの段階の活動に当たる？", "封じ込め"], "4-130": ["マルウェアの駆除後、クリーンなイメージから再構築したサーバーを本番に戻し、再感染がないか監視を強化した。これはどの段階か？", "復旧"], "4-131": ["セキュリティ意識の低いユーザーによる誤操作を減らすため、インシデント対応計画の訓練に一般社員を含める主な理由はどれ？", "社員がインシデントを早く気づき、正しく報告できるようにするため"], "4-132": ["フォレンジックの証拠取得で、調査対象のディスクに誤って書き込むことを防ぐ機器はどれ？", "ライトブロッカー"], "4-133": ["脆弱性スキャンの自動レポートを、インシデント調査のデータ源として活用する目的として最も適切なものはどれ？", "攻撃者が悪用した可能性のある脆弱性を特定するため"], "4-134": ["ネットワークの監視で、普段は通信しないはずのサーバー同士がSMB（TCP 445）で大量に通信していることを発見した。最も疑われることはどれ？", "ワームやランサムウェアによる横展開"], "4-135": ["インシデントの影響を受けたシステムについて、利害関係者や経営層に向けて状況を伝える際に最も重要なことはどれ？", "定めた連絡体制で、正確な情報を適時に伝える"], "4-136": ["社員のWindows PCを堅牢化する施策として、最も効果的なものの組み合わせはどれ？", "OSの自動更新、ホスト型ファイアウォールとEDRの有効化、一般ユーザー権限での利用"], "4-137": ["クラウドの管理コンソールに対する堅牢化として、最も優先すべきものはどれ？", "ルートアカウントにMFAを設定し、日常作業では使わない"], "4-138": ["アプリケーションのセキュリティ対策として、信頼できないコードを本番環境から隔離された制限付きの環境で実行させる手法はどれ？", "サンドボックス化"], "4-139": ["サーバーのCPU・メモリ・ディスク使用率を継続的に監視する、セキュリティ上の主な目的はどれ？", "異常な使用状況から侵害やサービス妨害の兆候を早期に発見するため"], "4-140": ["ICS（産業用制御システム）を堅牢化する際に、特に注意すべき点として最も適切なものはどれ？", "可用性を最優先し、パッチ適用や変更は事前に十分なテストを行ってから実施する"], "5-1": ["社員が会社のPCやネットワーク、メールをどのように使ってよいか（私的利用の禁止など）を定め、入社時に同意させる文書はどれ？", "許容利用ポリシー（AUP）"], "5-2": ["組織のセキュリティに対する経営層の方針や目標を示し、他のすべてのセキュリティ文書の土台となる最上位の文書はどれ？", "情報セキュリティポリシー（Infosec policy）"], "5-3": ["「パスワードは15文字以上とする」のように、ポリシーを実現するために全社で守るべき具体的で必須の要件を定めた文書はどれ？", "標準（Standard）"], "5-4": ["新しいサーバーの構築作業を、誰がやっても同じ結果になるよう手順を一つずつ記した文書はどれ？", "手順書（Procedure）"], "5-5": ["組織の推奨事項を示すが、従うかどうかは状況に応じて判断できる、強制力のない文書はどれ？", "ガイドライン"], "5-6": ["ソフトウェアの企画から設計・開発・テスト・運用・廃棄までの各段階で、セキュリティを組み込むための方針を何という？", "SDLC（ソフトウェア開発ライフサイクル）ポリシー"], "5-7": ["新入社員に対して、アカウントの発行、機器の貸与、セキュリティ研修の受講などを行う一連の手順を何という？", "オンボーディング"], "5-8": ["データの分類を決定し、そのデータへのアクセスを誰に許可するかについて最終的な責任を負う役割はどれ？", "データオーナー（所有者）"], "5-9": ["データオーナーの方針に従い、バックアップの取得やアクセス権の設定など、データの日々の保護作業を行う役割はどれ？", "データカストディアン（スチュワード）"], "5-10": ["GDPRにおいて、個人データの処理の目的と手段を決定する組織を何という？", "管理者（コントローラー）"], "5-11": ["企業が給与計算を外部の会社に委託した。GDPRの観点で、この委託先の会社の役割はどれ？", "処理者（プロセッサ）"], "5-12": ["GDPRで、自分の個人データの削除を企業に求めることができる権利を何という？", "忘れられる権利（削除権）"], "5-13": ["GDPRなどのプライバシー規制で、個人データの対象となっている本人のことを何という？", "データ主体（Data subject）"], "5-14": ["組織が保有する個人データの種類、保管場所、利用目的、保管期間などを一覧化したものを何という？", "データインベントリ"], "5-15": ["セキュリティ方針の決定を本社の1つの部門に集約するガバナンス構造の、主なメリットはどれ？", "組織全体で一貫した方針を適用しやすい"], "5-16": ["取締役会の下に設置され、組織のセキュリティ戦略やリスクを監督する、複数の役員で構成される組織はどれ？", "委員会（セキュリティ委員会など）"], "5-17": ["セキュリティポリシーを定期的に見直す必要がある主な理由として、最も適切なものはどれ？", "法規制、技術、業務環境、脅威の変化に対応するため"], "5-18": ["特定の社員に不正が隠れていないかを確認するため、社員に一定期間の連続休暇を義務付ける管理策はどれ？", "強制休暇（Mandatory vacation）"], "5-19": ["支払いの申請と承認を別々の人に担当させ、1人で不正を完結できないようにする管理策はどれ？", "職務分掌（Separation of duties）"], "5-20": ["社員を定期的に別の職務へ異動させ、不正の発見や業務の属人化防止を図る管理策はどれ？", "ジョブローテーション"], "5-21": ["退席時や退社時に、机の上に機密書類やメモを放置しないよう求めるポリシーはどれ？", "クリーンデスクポリシー"], "5-22": ["組織がセキュリティ対策を決める際に考慮すべき「外部の要因」として、最も適切なものはどれ？", "法規制、業界標準、国・地域ごとの法律"], "5-23": ["クレジットカード情報を扱う事業者が準拠しなければならない、カード業界のセキュリティ基準はどれ？", "PCI DSS"], "5-24": ["EU域内の個人データを扱う企業に適用され、違反時に高額な制裁金が科される可能性がある規則はどれ？", "GDPR"], "5-25": ["米国で、医療機関や保険会社が患者の健康情報を保護することを義務付けた法律はどれ？", "HIPAA"], "5-26": ["セキュリティに関する国際的なフレームワークのうち、情報セキュリティマネジメントシステム（ISMS）の要求事項を定め、第三者認証の対象となる規格はどれ？", "ISO/IEC 27001"], "5-27": ["Webアプリケーションの代表的な脆弱性を、リスクの高い順にまとめて定期的に公開しているものはどれ？", "OWASP Top 10"], "5-28": ["インシデント対応ポリシーで定めるべき内容として、最も適切なものはどれ？", "インシデントの定義、対応体制、役割と責任、報告の流れ"], "5-29": ["事業継続ポリシーの主な目的として最も適切なものはどれ？", "災害時も重要な業務を継続・早期再開する"], "5-30": ["社外の取引先と機密情報を共有する前に、情報を第三者に漏らさないことを法的に約束させる契約はどれ？", "秘密保持契約（NDA）"], "5-31": ["セキュリティ違反をした場合のコンプライアンス上の影響として、規制当局によって組織の事業許可が取り消されることを何という？", "ライセンスの喪失"], "5-32": ["規制の要求事項を満たしているかを社内の担当者が定期的に確認し、経営層に報告する活動を何という？", "内部コンプライアンス報告"], "5-33": ["組織が法令や規制を守るために、合理的な注意を払って適切な対策を「実施し続ける」ことを何という？", "デューケア（相当な注意）"], "5-34": ["個人情報保護の観点で、業務に必要な最小限の個人データだけを収集・保持する原則を何という？", "データ最小化"], "5-35": ["資産価値が1,000万円のサーバーで、1回の火災によりその40%が損なわれると見込まれる。単一損失予想額（SLE）はいくら？", "400万円"], "5-36": ["SLEが400万円の事象が、2年に1回の頻度で発生すると見込まれる。年間損失予想額（ALE）はいくら？", "200万円"], "5-37": ["年間損失予想額（ALE）が300万円のリスクに対し、年間100万円の対策を導入するとALEが50万円に下がる。この対策の年間の価値はいくら？", "150万円"], "5-38": ["リスクを金額などの数値で表さず、「高・中・低」のような評価尺度で分析する手法はどれ？", "定性的リスク分析"], "5-39": ["リスクを「発生可能性」と「影響度」の2軸で整理し、色分けして優先度を示す表を何という？", "リスクマトリクス（ヒートマップ）"], "5-40": ["特定されたリスクごとに、内容・評価・担当者・対応策・状況などを一覧にして管理する文書はどれ？", "リスクレジスター（リスク登録簿）"], "5-41": ["特定のリスクについて、その管理と対応に責任を持つ人物を何という？", "リスクオーナー"], "5-42": ["リスクが高まっていることを早めに知らせる指標（例：未適用パッチの数の増加）を何という？", "重要リスク指標（KRI）"], "5-43": ["組織が目標を達成するために、受け入れてもよいと考えるリスクの全体的な量や種類を何という？", "リスク選好（Risk appetite）"], "5-44": ["新規事業に積極的に投資するため、高めのリスクも受け入れる方針をとる組織のリスク選好はどれ？", "拡大型（Expansionary）"], "5-45": ["サイバー攻撃による損害に備えてサイバー保険に加入した。このリスク対応はどれ？", "リスク移転"], "5-46": ["セキュリティ上の懸念が大きいため、計画していた新サービスの提供そのものを中止した。このリスク対応はどれ？", "リスク回避"], "5-47": ["ファイアウォールやMFAを導入して、リスクの発生可能性や影響を下げるリスク対応はどれ？", "リスク軽減（低減）"], "5-48": ["対策のコストがリスクによる想定損失を上回るため、何もせずそのリスクを受け入れると経営層が判断した。このリスク対応はどれ？", "リスク受容"], "5-49": ["規制で求められる管理策を一時的に実施できないため、期限付きで正式に適用を免除してもらう手続きを何という？", "免除（Exemption）／例外"], "5-50": ["対策を実施した後もなお残っているリスクを何という？", "残存リスク"], "5-51": ["システムが停止した場合に、どの業務にどれだけの影響が出るかを分析し、復旧の優先順位を決める活動はどれ？", "ビジネス影響度分析（BIA）"], "5-52": ["障害発生後、システムを復旧させるまでに許容される最大の時間を何という？", "RTO（目標復旧時間）"], "5-53": ["「障害時に失ってよいデータは最大1時間分まで」と定めた。これは何を決めたことになる？", "RPO（目標復旧時点）"], "5-54": ["機器が故障してから、修理して再び使えるようになるまでの平均時間を何という？", "MTTR（平均修復時間）"], "5-55": ["機器の信頼性を示す指標で、故障から次の故障までの平均的な稼働時間を何という？", "MTBF（平均故障間隔）"], "5-56": ["リスク評価の実施タイミングとして、重要なシステムの設定変更のたびに行うのではなく、毎年決まった時期に行う方式はどれ？", "定期的（Recurring）"], "5-57": ["リスク評価で、ある脅威が組織の脆弱性を突いて実際に発生する見込みを何という？", "発生可能性（Likelihood）"], "5-58": ["定量的リスク分析で、1回の事象によって資産価値の何%が失われるかを示す値を何という？", "暴露係数（EF）"], "5-59": ["リスク管理の一連の流れとして正しい順番はどれ？", "特定 → 評価・分析 → 対応 → 監視・報告"], "5-60": ["組織がリスクを受け入れられる上限の値で、これを超えたら対応が必要に  "コネクタの汚れ、急な曲げ、距離が長すぎること"], "5-18": ["新しく敷設したLANケーブルで1Gbpsの通信ができず、100Mbpsでしかリンクしない。最も可能性の高い原因はどれ？", "一部のペアの結線ミスや、カテゴリの低いケーブル"], "5-19": ["ケーブルの両端の結線が正しいか、断線やショートがないかを確認する道具はどれ？", "ケーブルテスター"], "5-20": ["壁の差込口からパッチパネルのどのポートにつながっているか分からない配線を探すために使う道具の組み合わせはどれ？", "トーンジェネレーターとプローブ（トナー）"], "5-21": ["ネットワーク機器のポートが正常に送受信できるかを確かめるため、送信した信号を自分自身に戻すように差し込む道具はどれ？", "ループバックプラグ"], "5-22": ["RJ45コネクタに線を圧着して取り付けるための工具はどれ？", "圧着工具（クリンパー）"], "5-23": ["スイッチのインターフェースの統計で、64バイト未満の短すぎるフレーム（ラント）が増加している。考えられる原因として最も適切なものはどれ？", "デュプレックスの不一致"], "5-24": ["スイッチのインターフェースの統計で、MTUより大きすぎるフレーム（ジャイアント）が記録されている。考えられる原因として最も適切なものはどれ？", "隣接機器とのMTU設定の不一致"], "5-25": ["スイッチのインターフェースで、CRCエラーが継続的に増加している。最初に疑うべきものはどれ？", "ケーブルやコネクタの不良、電磁干渉などの物理的な問題"], "5-26": ["スイッチのインターフェースで、出力ドロップ（送信時の破棄）が増え続けている。考えられる原因として最も適切なものはどれ？", "そのポートの帯域を超える通信が集中している（輻輳）"], "5-27": ["スイッチのポートの状態が「err-disabled」になっていた。考えられる原因として最も適切なものはどれ？", "ポートセキュリティ違反などで自動的に無効化された"], "5-28": ["スイッチのポートの状態が「administratively down」になっていた。これは何を意味する？", "管理者の設定で無効化されている"], "5-29": ["スイッチのポートで、リンクのアップとダウンが短い間隔で繰り返されている（リンクフラップ）。考えられる原因として最も適切なものはどれ？", "ケーブルやSFPの不良、自動交渉の不具合"], "5-30": ["PoE給電のIP電話をスイッチに接続したが、電話の電源が入らない。ほかの電話機は正常に動作している。最初に確認すべきこととして最も適切なものはどれ？", "PoEの電力予算の残りとポートのPoE設定"], "5-31": ["PoE+（802.3at）が必要な無線アクセスポイントを、802.3af対応のスイッチに接続した。起こりうる症状として最も適切なものはどれ？", "APが起動しないか、機能が制限される"], "5-32": ["2台の機器を接続するSFPモジュールの片方が1000BASE-SX、もう片方が1000BASE-LXだった。考えられる問題はどれ？", "種類が一致せず、リンクが確立しない"], "5-33": ["STPの設定ミスにより、意図しない古いアクセススイッチがルートブリッジに選ばれ、通信が非効率な経路を通っている。最も適切な対策はどれ？", "コアスイッチの優先度を下げてルートにする"], "5-34": ["スイッチ間に冗長リンクを追加した直後から、ネットワーク全体が極端に遅くなり、スイッチのCPU使用率が100%になった。最も可能性の高い原因はどれ？", "STPが無効になっていてL2ループが発生した"], "5-35": ["ある社員のPCだけが、同じ部署の他のPCと通信できず、別の部署のサーバーにも届かない。調べるとスイッチのポートが別のVLANに割り当てられていた。この問題の分類はどれ？", "VLANの割り当ての誤り"], "5-36": ["新しく追加したVLAN 30の端末が、別のスイッチにあるVLAN 30の端末と通信できない。スイッチ間のトランクで確認すべき点として最も適切なものはどれ？", "トランクの許可VLANにVLAN 30が含まれているか"], "5-37": ["ファイアウォールの設定変更後、ある部署から社内Webサーバーへアクセスできなくなった。最初に確認すべきものはどれ？", "変更したルールとその順序"], "5-38": ["PCに静的に設定したIPアドレスが、別の機器と重複している場合に起こる症状として最も適切なものはどれ？", "通信が途切れたり、競合の警告が出たりする"], "5-39": ["PCのデフォルトゲートウェイが誤ったアドレスに設定されている場合に起こる症状はどれ？", "同じサブネット内とは通信できるが、他のネットワークとは通信できない"], "5-40": ["PCのサブネットマスクが誤って/16に設定されている（正しくは/24）場合に起こりうる症状はどれ？", "一部のリモート宛ての通信がゲートウェイに送られず届かない"], "5-41": ["PCのIPアドレスは正しく設定されており、IPアドレスでWebサーバーにアクセスできるが、URL（ホスト名）ではアクセスできない。最も可能性の高い原因はどれ？", "DNSの設定または名前解決の問題"], "5-42": ["多くのPCに169.254.x.xのアドレスが割り当てられていた。最も可能性の高い原因はどれ？", "DHCPに届かないか、スコープが枯渇している"], "5-43": ["ルーターのルーティングテーブルに、ある拠点のネットワークへの経路が存在しない場合に起こることはどれ？", "デフォルトルートがなければ破棄される"], "5-44": ["社内の一部のネットワーク宛ての通信が、ルーターAとルーターBの間を行ったり来たりして届かない。tracerouteで同じ2つのアドレスが繰り返し表示された。この問題はどれ？", "ルーティングループ"], "5-45": ["社内ネットワークで、ある時間帯だけ通信が遅くなる。フローデータを確認したところ、バックアップの通信が回線の帯域をほぼ使い切っていた。この状態を何という？", "輻輳"], "5-46": ["10Gbpsのリンクを持つサーバー群が、1Gbpsのアップリンクしかないスイッチにまとめて接続されているため、全体の通信が遅くなっている。この問題を何という？", "ボトルネック"], "5-47": ["IP電話で、相手の声が途切れたりロボットのような音になったりする。ネットワークで最も疑うべき指標はどれ？", "ジッターとパケットロス"], "5-48": ["海外拠点とのビデオ会議で、話し始めてから相手が反応するまでに大きな時間差がある。最も関係の深い指標はどれ？", "遅延（レイテンシ）"], "5-49": ["ネットワークの速度測定ツールで回線の速度を測ったところ、契約帯域よりかなり低い値が出た。原因を切り分ける方法として最も適切なものはどれ？", "直結した状態と普段の環境の値を比べる"], "5-50": ["無線LANの利用者から「会議室の奥の席だけ電波が弱く、頻繁に切断される」と報告があった。最も適切な対策はどれ？", "サイトサーベイをしてAPを追加・移設する"], "5-51": ["Wi-Fiアナライザーで調べたところ、オフィスの複数のAPが2.4GHz帯のチャネル3、4、5を使っていた。考えられる問題はどれ？", "チャネルの重なりによる干渉"], "5-52": ["無線LANの周囲の電波状況（チャネルの使用状況や信号強度、干渉）を確認するために使うツールはどれ？", "Wi-Fiアナライザー"], "5-53": ["無線LANの端末で、RSSI（受信信号強度）が-85dBmと表示された。この値について正しい説明はどれ？", "信号が弱く、通信が不安定になりやすい"], "5-54": ["無線LANの端末が、オフィス内を移動中に別のAPへ切り替わる際、毎回数秒間通信が途切れる。最も関係の深い問題はどれ？", "ローミングの設定不備（APの重なり不足や高速ローミング未対応）"], "5-55": ["無線LANの端末が、APに接続後しばらくすると切断され、再接続を繰り返す（ディスアソシエーション）。考えられる原因として適切でないものはどれ？", "ケーブルのカテゴリが高すぎる"], "5-56": ["無線LANの利用者が、APの近くにいるのに通信速度が非常に遅い。調べると、その周辺に古い802.11b専用の機器が接続されていた。考えられる問題はどれ？", "低速な古い端末が電波の利用時間を多く占有し、全体の性能が落ちている"], "5-57": ["Windows PCで、IPアドレス、サブネットマスク、デフォルトゲートウェイ、DNSサーバーの設定を詳しく確認するコマンドはどれ？", "ipconfig /all"], "5-58": ["Windows PCで、DHCPから取得したIPアドレスを解放し、再取得するためのコマンドの組み合わせはどれ？", "ipconfig /release と ipconfig /renew"], "5-59": ["PCのDNSキャッシュに古い名前解決の結果が残っていて、移転したサーバーにアクセスできない。Windowsで実行すべきコマンドはどれ？", "ipconfig /flushdns"], "5-60": ["宛先までの経路上にあるルーターを順番に表示し、どこで通信が止まっているかを調べるWindowsのコマンドはどれ？", "tracert"], "5-61": ["DNSサーバーに問い合わせて、ホスト名に対応するIPアドレスや特定のレコードを調べるコマンドはどれ？", "nslookup"], "5-62": ["PC上で現在確立されているTCP接続や、待ち受け中のポートを一覧表示するコマンドはどれ？", "netstat"], "5-63": ["PCのARPキャッシュに登録されている、IPアドレスとMACアドレスの対応を表示するコマンドはどれ？", "arp -a"], "5-64": ["ネットワーク上のホストに対して、開いているポートや稼働しているサービスを調べるスキャンツールはどれ？", "nmap"], "5-65": ["Linuxのコマンドラインで、ネットワークインターフェースを流れるパケットをキャプチャして表示するツールはどれ？", "tcpdump"], "5-66": ["キャプチャしたパケットをプロトコルごとに解析し、TCPの再送やハンドシェイクの失敗などを詳しく確認するツールはどれ？", "プロトコルアナライザー（Wiresharkなど）"], "5-67": ["シスコ系のスイッチで、各MACアドレスがどのポートとVLANで学習されているかを表示するコマンドはどれ？", "show mac address-table"], "5-68": ["ルーターで、現在のルーティングテーブルを表示し、宛先への経路があるか確認するコマンドはどれ？", "show ip route"], "5-69": ["スイッチで、インターフェースの状態、速度、デュプレックス、エラーカウンターなどを確認するコマンドはどれ？", "show interfaces"], "5-70": ["スイッチで、作成されているVLANと、それぞれに割り当てられているポートを一覧表示するコマンドはどれ？", "show vlan"], "5-71": ["PoEスイッチで、各ポートの給電状況とスイッチ全体の電力使用量を確認するコマンドはどれ？", "show power inline"], "5-72": ["ルーターで、IPアドレスとMACアドレスの対応表（ARPテーブル）を表示するコマンドはどれ？", "show arp"], "5-73": ["ネットワーク機器で、現在動作中の設定内容を表示するコマンドはどれ？", "show running-config"], "5-74": ["スイッチで、隣接している機器の機種名と接続ポートを、ベンダーに依存しない方法で確認するコマンドはどれ？", "show lldp neighbors"], "5-75": ["トラブルシューティングで、pingの応答はあるがWebページが表示されない場合に、次に確認すべきこととして最も適切なものはどれ？", "Webサービスとポート80/443、FWのルール"], "5-76": ["ある端末から宛先へpingを送ったところ「Request timed out」と表示された。しかし宛先のサーバーは正常に稼働していた。考えられる原因として最も適切なものはどれ？", "経路上のファイアウォールでICMPが遮断されている"], "5-77": ["tracerouteの結果で、途中のホップが「* * *」と表示されたが、最終的な宛先には到達した。この結果の解釈として最も適切なものはどれ？", "途中のルーターがICMPに応答しないだけで、通信は正常"], "5-78": ["pingで、パケットのサイズを大きくし、分割禁止（DFビット）を設定して送ったところ、ある大きさ以上で失敗した。この方法で調べているものはどれ？", "パスMTU"], "5-79": ["VPN接続後、Webサイトの一部のページだけ表示が途中で止まる、ファイルのダウンロードが失敗するなど、大きな通信だけが失敗する。最も可能性の高い原因はどれ？", "トンネルのオーバーヘッドによるMTUの問題"], "5-80": ["新しく設置したサーバーにアクセスできない。サーバーのIPアドレスは正しく設定されているが、スイッチのMACアドレステーブルにそのサーバーのMACアドレスが表示されない。最初に確認すべきものはどれ？", "物理的な接続（ケーブル、ポートのリンク状態）"], "5-81": ["DHCPを使っている端末の一部だけが、正しいアドレスではなく別のネットワークのアドレスやゲートウェイを受け取っている。最も可能性の高い原因はどれ？", "ネットワーク内に不正なDHCPサーバーが存在する"], "5-82": ["社内の全利用者が、同時にすべてのクラウドサービスにアクセスできなくなった。社内のサーバーには問題なくアクセスできる。最初に疑うべき箇所はどれ？", "インターネットへの出口（境界ルーター・ファイアウォール・回線）"], "5-83": ["スイッチの交換作業の後、そのスイッチに接続された端末だけが通信できなくなった。最初に疑うべきこととして最も適切なものはどれ？", "新しいスイッチのVLANやトランク、アップリンクの設定"], "5-84": ["ある端末から特定のサーバーへの通信だけが極端に遅い。他のサーバーへの通信は速い。原因を切り分けるために最初に行うこととして適切なものはどれ？", "tracerouteで経路を確認し、遅延の大きいホップを探す"], "5-85": ["無線LANの利用者から「昼休みになると電波が悪くなる」と報告があった。最も可能性の高い原因はどれ？", "給湯室の電子レンジによる2.4GHz帯の干渉"], "5-86": ["無線LANのアクセスポイントの送信出力を最大にしたところ、かえって端末の通信が不安定になった。考えられる理由として最も適切なものはどれ？", "端末の電波がAPに届きにくくなり、干渉も増える"], "5-87": ["社内の無線LANで、SSIDは見えているのに接続できない端末がある。ほかの端末は正常に接続できている。まず確認すべきこととして最も適切なものはどれ？", "端末の暗号化・認証方式の対応と、入力した認証情報"], "5-88": ["無線LANの利用者が多い大会議室で、多数の端末が接続すると通信が極端に遅くなる。最も適切な対策はどれ？", "APを増設し、チャネルと出力を調整して1台あたりの接続数を分散する"], "5-89": ["トラブルシューティングで、問題を特定する際に「最近何か変更しましたか？」と確認する理由として最も適切なものはどれ？", "障害の多くは直前の変更が原因であり、原因の候補を素早く絞り込めるため"], "5-90": ["複数の問題が同時に報告された場合のトラブルシューティングの進め方として、最も適切なものはどれ？", "それぞれの問題を個別に切り分けて、1つずつ対処する"], "5-91": ["トラブルシューティングで、解決策を実施する前に検討すべきこととして最も適切なものはどれ？", "解決策が業務に与える影響と、変更管理の承認が必要か"], "5-92": ["ある部署全体のPCが、急にネットワークに接続できなくなった。その部署のPCはすべて同じアクセススイッチに接続されている。最も疑わしい箇所はどれ？", "そのアクセススイッチ、またはそのアップリンク"], "5-93": ["IP電話の通話品質が悪いと報告があった。調べると、音声VLANにQoSの設定がされていなかった。最も適切な対策はどれ？", "音声にDSCP/CoSを付け、優先キューで処理する"], "5-94": ["スイッチ間をLACPで2本束ねたリンクの片方だけが動作しておらず、帯域が半分になっていた。最初に確認すべきこととして最も適切なものはどれ？", "両端のポートの速度・VLANとLACPのモード"], "5-95": ["NTPサーバーとの同期がずれていたネットワークで発生しやすい問題として、最も適切なものはどれ？", "ログの時刻がずれ、証明書やKerberos認証が失敗する"], "5-96": ["ブラウザで社内のWebサイトにアクセスしたところ、「証明書の有効期限が切れています」と表示された。ネットワークの問題として最初に疑うべきことはどれ？", "証明書の期限切れ、または時刻のずれ"], "5-97": ["社内の一部の端末が、外部のWebサイトにはアクセスできるが、社内のファイルサーバーにだけアクセスできない。共通点として、それらの端末だけ外部のDNSサーバーが設定されていた。原因として最も適切なものはどれ？", "外部DNSでは社内の名前を解決できない"], "5-98": ["ネットワークのトラブル対応で、障害が起きる前に取得していたベースラインが役立つ理由として最も適切なものはどれ？", "平常時と比べて、異常をすぐ判断できる"], "5-99": ["サーバーへの通信が遅い原因を調べるため、パケットキャプチャを行ったところ、TCPの再送とウィンドウサイズ0の通知が多数見られた。考えられる原因として最も適切なものはどれ？", "パケットロスや受信側の処理能力不足"], "5-100": ["社内のネットワークで、特定のスイッチポートに接続した端末だけが頻繁に「IPアドレスの競合」を警告する。原因を特定するための最初の手順として適切なものはどれ？", "ARPテーブルでMACを調べ、MACテーブルで接続ポートを探す"], "5-101": ["トラブルシューティングで「問題を再現する」ことの主な利点はどれ？", "仮説を検証しやすく、解決も確認できる"], "5-102": ["光ファイバーの長距離回線で、断線箇所までの距離を測定するために使う機器はどれ？", "OTDR（光パルス試験器）"], "5-103": ["新しく構築したネットワークで、すべての機器が正しく設定されているのに、ある拠点のルーターがOSPFの隣接関係を確立できない。確認すべき項目として最も適切なものはどれ？", "エリアID・認証・MTUの設定の一致"], "5-104": ["ネットワークが断続的に遅くなる問題で、発生時刻が特定できない。原因を特定するために最も適切な方法はどれ？", "性能データとログを継続的に記録し、後から分析する"], "5-105": ["社内の利用者から「共有フォルダーは開けるが、ファイルのコピーが非常に遅い」と報告があった。スイッチのポートを確認すると、速度が10Mbps・半二重でリンクしていた。最も適切な対処はどれ？", "ケーブルを確認し、速度・デュプレックスを両端で揃える"], "5-106": ["社内のネットワークで、あるサブネットのDHCPスコープの使用率が常に100%近くになっている。将来的な問題を防ぐための対策として最も適切なものはどれ？", "スコープの範囲を広げるか、サブネットを分割・拡張する"], "5-107": ["スイッチで、ある端末のMACアドレスが短時間に複数のポートの間を移動しているというログが出力された。考えられる原因として最も適切なものはどれ？", "L2ループの発生、またはMACアドレスの重複・なりすまし"], "5-108": ["Webブラウザでのアクセスはできないが、同じサーバーにSSHでは接続できる。この状況から分かることとして最も適切なものはどれ？", "疎通はOKで、Webサービスかポートに問題がある"], "5-109": ["ある拠点で、WAN回線の障害後に予備回線へ自動で切り替わらなかった。確認すべきこととして最も適切なものはどれ？", "フェールオーバーの経路設定と予備回線の状態"], "5-110": ["社内のネットワーク機器の設定を変更した後、問題が起き、原因が特定できない。業務への影響が大きい場合に最も適切な対応はどれ？", "まず切り戻して復旧し、その後に原因を調べる"], "5-111": ["ネットワークの障害対応が終わった後に作成する報告書に含めるべき内容として、最も適切なものはどれ？", "症状、原因、実施した対応、結果、再発防止策"], "5-112": ["ある利用者のPCが、ネットワークに接続できない。リンクランプが点灯しておらず、ケーブルを別のPCで試すと正常に通信できた。次に疑うべきものはどれ？", "元のPCのNICとドライバー、設定"], "5-113": ["ネットワークの速度が遅いという報告を受け、速度測定ツールで社外のサーバーとの帯域を測定した。結果を評価する際に考慮すべきこととして最も適切なものはどれ？", "時間帯・測定先・有線か無線かなどの条件"], "5-114": ["スイッチのポートで、出力のエラーやドロップがなく、リンクも正常だが、接続された端末の通信が遅い。考えられる原因として最も適切なものはどれ？", "端末の負荷やアプリケーションの問題"], "5-115": ["スパニングツリーの設定で、意図しないポートがブロッキングされ、通信が遠回りの経路を通っている。確認すべきこととして最も適切なものはどれ？", "ルートブリッジの位置と各ポートのコスト"], "5-116": ["社内の一部のPCが、無線LANに接続すると社内のサーバーにアクセスできるが、有線LANに接続するとアクセスできない。有線のポートを確認すると、ゲスト用VLANに割り当てられていた。この問題の対処として正しいものはどれ？", "スイッチのポートを社員用のVLANに割り当て直す"], "5-117": ["トラブルシューティングで、利用者から「メールが送れない」と報告があった。受信はできている。最初に確認すべきこととして最も適切なものはどれ？", "SMTPの設定と送信ポート25/587の通信許可"], "5-118": ["Linuxサーバーで、DNSの問い合わせ結果をTTLや権威サーバーの情報も含めて詳しく表示するコマンドはどれ？", "dig"], "5-119": ["Linuxで、インターフェースのIPアドレスやリンク状態を確認するための現在主流のコマンドはどれ？", "ip addr（ipコマンド）"], "5-120": ["ある利用者のPCがネットワークに接続できない。ipconfigで確認すると、IPアドレスが0.0.0.0やアドレスなしの状態になっていた。最初に確認すべきこととして最も適切なものはどれ？", "NICが有効か、ケーブルが接続されリンクしているか"]}}};
const ENDPOINT = (window.QUIZ_CONFIG && window.QUIZ_CONFIG.endpoint) || "";
let exam = "sec"; const cache = {};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
try { const h = location.hash.slice(1); if (h === "net" || h === "sec") exam = h; } catch (e) {}

function setExam(e) {
  exam = e; document.body.dataset.exam = e;
  $("b-sec").setAttribute("aria-pressed", String(e === "sec"));
  $("b-net").setAttribute("aria-pressed", String(e === "net"));
  load();
}
$("b-sec").onclick = () => setExam("sec");
$("b-net").onclick = () => setExam("net");

function load() {
  const body = $("body");
  if (!ENDPOINT) { body.innerHTML = '<div class="panel"><div class="empty">集計の送信先がまだ設定されていません。<br>config.js に Apps Script のウェブアプリURLを入れると、ここに集計が表示されます。</div></div>'; return; }
  if (cache[exam]) return render(cache[exam]);
  body.innerHTML = '<div class="empty">集計を読み込んでいます…</div>';
  fetch(ENDPOINT + "?exam=" + exam).then(r => r.json()).then(s => {
    if (!s || !s.ok) throw new Error("bad");
    cache[exam] = s; render(s);
  }).catch(() => { body.innerHTML = '<div class="panel"><div class="empty">集計を読み込めませんでした。少し時間をおいて開き直してください。</div></div>'; });
}

function render(s) {
  const meta = Q[exam], body = $("body");
  if (!s.total) { body.innerHTML = '<div class="panel"><div class="empty">まだ解答が届いていません。<br><a href="' + meta.page + '">' + meta.label + 'の問題集</a>で解くと、ここに集計が表示されます。</div></div>'; return; }
  let ok = 0; Object.values(s.d).forEach(v => ok += v[1]);
  const kpis = '<div class="kpis">' +
    '<div class="kpi"><span class="l">解答数</span><span class="v">' + s.total.toLocaleString() + '<small>件</small></span></div>' +
    '<div class="kpi"><span class="l">解答した人</span><span class="v">' + s.people.toLocaleString() + '<small>人</small></span><span class="l">うちID登録 ' + (s.members || 0) + '人</span></div>' +
    '<div class="kpi"><span class="l">全体の正答率</span><span class="v">' + pct(ok, s.total) + '<small>%</small></span></div></div>';

  const doms = meta.domains.map(d => {
    const v = s.d[String(d.id)] || [0, 0], p = pct(v[1], v[0]);
    return '<span class="name">' + esc(d.name) + '</span><span class="val">' + (v[0] ? p + '%' : '—') + '<small>' + v[0] + '件</small></span>' +
      '<div class="track' + (v[0] && p < 80 ? ' low' : '') + '" tabindex="0" data-tip="' + esc(d.name + '：' + (v[0] ? p + '%（' + v[1] + '/' + v[0] + '）' : '解答なし')) + '"><i style="width:' + p + '%"></i><b></b></div><span></span>';
  }).join("");
  const domPanel = '<section class="panel"><div class="ph"><h2>分野別の正答率</h2><span class="note">縦線は合格目安の80%</span></div>' +
    '<div class="dom">' + doms + '</div>' +
    '<div class="legend"><span><i class="sw" style="background:var(--accent)"></i>80%以上</span><span><i class="sw" style="background:var(--low)"></i>80%未満</span></div></section>';

  // daily volume (last 30 days that have data, filled)
  const keys = Object.keys(s.days).sort();
  let dayPanel = "";
  if (keys.length) {
    const end = new Date(keys[keys.length - 1] + "T00:00:00"), list = [];
    const ymd = t => t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
    for (let i = 29; i >= 0; i--) { const t = new Date(end); t.setDate(end.getDate() - i); const k = ymd(t); list.push([k, s.days[k] || 0]); }
    const max = Math.max(1, ...list.map(x => x[1]));
    const bars = list.map(([k, n]) => '<div class="bar" tabindex="0" style="height:' + (n ? Math.max(4, n / max * 100) : 0) + '%" data-tip="' + k.slice(5).replace("-", "/") + '：' + n + '件"></div>').join("");
    dayPanel = '<section class="panel"><div class="ph"><h2>日ごとの解答数</h2><span class="note">直近30日・最大 ' + max + '件/日</span></div>' +
      '<div class="days">' + bars + '</div><div class="daysx"><span>' + list[0][0].slice(5).replace("-", "/") + '</span><span>' + list[29][0].slice(5).replace("-", "/") + '</span></div></section>';
  }

  // hardest questions
  const rows = Object.entries(s.q).filter(([, v]) => v[0] >= 3)
    .map(([id, v]) => [id, v[0], v[1], v[1] / v[0]]).sort((a, b) => a[3] - b[3] || b[1] - a[1]).slice(0, 20);
  const dn = id => (meta.domains.find(d => d.id === +id.split("-")[0]) || {}).short || "";
  const trs = rows.map(([id, n, c, r]) => {
    const t = meta.q[id] || ["", ""], p = Math.round(r * 100);
    return '<tr><td class="qid">' + id + '<div class="ans">' + esc(dn(id)) + '</div></td><td>' + esc(t[0]) + '<div class="ans">正解：' + esc(t[1]) + '</div></td>' +
      '<td><div class="rate"><div class="t' + (p >= 80 ? ' ok' : '') + '"><i style="width:' + p + '%"></i></div><span>' + p + '%</span></div></td><td class="num">' + c + '/' + n + '</td></tr>';
  }).join("");
  const hard = '<section class="panel"><div class="ph"><h2>よく間違えられている問題</h2><span class="note">解答3件以上の問題から正答率の低い順に20問</span></div>' +
    (rows.length ? '<div class="tablewrap"><table><thead><tr><th>No.</th><th>問題</th><th>正答率</th><th style="text-align:right">正解/解答</th></tr></thead><tbody>' + trs + '</tbody></table></div>'
                 : '<div class="empty">解答が3件以上集まった問題がまだありません。</div>') + '</section>';

  body.innerHTML = '<div style="display:flex;flex-direction:column;gap:20px">' + kpis + domPanel + dayPanel + hard + '</div>';
  $("sub").textContent = "送られた解答（問題番号と正誤）から集計しています。個人ごとの成績はここには表示しません。最終更新 " + new Date(s.updated).toLocaleString("ja-JP");
}

// tooltip for bars
const tip = $("tip");
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const w = tip.offsetWidth; tip.style.left = Math.min(Math.max(8, x - w / 2), innerWidth - w - 8) + "px"; tip.style.top = (y - 36) + "px"; }
document.addEventListener("pointermove", e => { const el = e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } });
document.addEventListener("focusout", () => { tip.hidden = true; });

setExam(exam);
</script>
</body>
